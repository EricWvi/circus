name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and package CLI archives
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p dist .tmp/release
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            dir=".tmp/release/$target"
            mkdir -p "$dir"
            GOOS="${target%-*}" GOARCH="${target#*-}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "$dir/circus" ./cmd/circus
            if [[ "$target" == linux-amd64 ]]; then
              test "$("$dir/circus" version)" = "$TAG"
            fi
            tar -czf "dist/circus-$TAG-$target.tar.gz" -C "$dir" circus
          done
      - name: Generate checksums
        working-directory: dist
        run: sha256sum circus-* > SHA256SUMS
      - name: Generate update manifest
        run: node scripts/release-manifest.mjs dist "$GITHUB_REPOSITORY" "$TAG"
      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/circus-*.tar.gz
            dist/SHA256SUMS
            dist/latest.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft=false)
          if [[ "$TAG" != *-* ]]; then
            flags+=(--latest)
          fi
          gh release edit "$TAG" "${flags[@]}"

  image:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Set image metadata
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/circus:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/circus:buildcache,mode=max
          build-args: VERSION=${{ env.TAG }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/circus:${{ env.IMAGE_VERSION }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}/circus:latest', env.OWNER_LC) || '' }}
