name: Nightly

on:
  schedule:
    # 19:17 UTC daily; off the top of the hour to dodge scheduler congestion.
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 500 seeds of the router random-sequence sweep, split into five segments
  # so a hang is attributed to one segment. CIRCUS_ROUTER_TIMEOUT_SCALE=2
  # stretches the harness's real-time waits for slower CI runners.
  router-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # the first seed of each 100-seed segment of the 1..500 sweep.
        first-seed: [1, 101, 201, 301, 401]
    env:
      CIRCUS_ROUTER_TIMEOUT_SCALE: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: seeds from ${{ matrix.first-seed }}
        run: task seeds CIRCUS_ROUTER_SEEDS=100 CIRCUS_ROUTER_FIRST_SEED=${{ matrix.first-seed }}

  # Three race runs of the e2e suite in parallel, one pass each: three
  # passes in one process outgrow go test's 10-minute timeout. Even one
  # pass of the whole suite does now, so each run covers one group of its
  # tests (scripts/e2e-race-groups.mjs, which checks that every test is in
  # exactly one group): three passes of every group.
  e2e-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [sessions, providers, calls]
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The e2e harness builds the TypeScript worker, which needs the npm
      # workspace (tsc and the SDK) installed.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: every e2e test is in exactly one group
        run: node scripts/e2e-race-groups.mjs --check
      - name: race pass ${{ matrix.run }} of group ${{ matrix.group }}
        run: task e2e-race E2E_COUNT=1 E2E_RUN="$(node scripts/e2e-race-groups.mjs '${{ matrix.group }}')"
