name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test scripts/
      - run: node --test scripts/e2e-race-groups.test.mjs
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
          github_token: ${{ github.token }}
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - run: task lint test check-gen
      - run: npx tsc --noEmit -p gen/ts
      - run: npm -w @circus/web run typecheck
      - run: npm -w @circus/web run lint
      - run: npm -w @circus/web run test
      - run: npm -w @circus/web run build
      - run: npm -w @circus/worker run build
      - run: go build -tags webui -o /dev/null ./cmd/circus
      # The e2e harness builds bin/circus and the TypeScript worker.
      - run: task e2e

  # The worker's release package, unpacked outside the repository (so it
  # cannot load the repository's node_modules), installs Claude Code from a
  # local registry stub and runs a session against a real control plane.
  worker-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - run: task worker:package
      - name: Unpack the package into an empty directory outside the repository
        run: |
          dir="$RUNNER_TEMP/worker-package"
          rm -rf "$dir"
          mkdir -p "$dir"
          tar -xzf .tmp/worker-package/circus-worker-v0.0.0-dev-linux-amd64.tar.gz -C "$dir"
          echo "CIRCUS_E2E_WORKER_PACKAGE=$dir/circus-worker" >> "$GITHUB_ENV"
      - run: go test -tags e2e ./tests/e2e/ -count=1 -run '^TestWorkerPackage$' -v

  # The race job runs in parallel with check: go test ./... needs neither the
  # npm nor the buf setup (gen/ is checked in), so this job stays minimal.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - run: task race

  # The packages with macOS-specific code, and the worker's tests, on macOS.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Go tests with the race detector
        run: >-
          go test -race -count=1
          ./cmd/circus/...
          ./internal/execguard/...
          ./internal/userservice/...
          ./internal/workerservice/...
          ./internal/selfupdate/...
          ./internal/daemon/workspace/...
          ./internal/daemon/ledgersnap/...
          ./internal/daemon/fstools/...
          ./internal/daemon/dirlist/...
          ./internal/ledger/snapshot/...
          ./internal/machineid/...
          ./internal/daemonlock/...
          ./internal/testutil/npmstub/...
      # The worker's tests run even when a Go test failed.
      - if: success() || failure()
        run: npm -w @circus/worker run test
      # Last: this installs the daemon and worker services as launchd agents
      # of the runner's user, and a failed cleanup could leave them loaded
      # for any later step; the runner itself is discarded after the job.
      - name: Daemon and worker services under the real launchd
        if: success() || failure()
        env:
          CIRCUS_REAL_LAUNCHD: "1"
        run: go test -race -count=1 -run '^TestRealLaunchdServices$' ./cmd/circus/
