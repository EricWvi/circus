name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
      - run: task lint test check-gen
      - run: npx tsc --noEmit -p gen/ts
      # The e2e harness builds bin/circus itself; Go, Bash and coreutils are
      # enough for it.
      - run: task e2e

  # The race job runs in parallel with check: go test ./... needs neither the
  # npm nor the buf setup (gen/ is checked in), so this job stays minimal.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
      - run: task race
