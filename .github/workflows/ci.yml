name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
      - run: task lint test check-gen
      - run: npx tsc --noEmit -p gen/ts
