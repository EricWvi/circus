syntax = "proto3";

package circus.v1;

import "circus/v1/device.proto";

option go_package = "github.com/EricWvi/circus/gen/go/circus/v1;circusv1";

// LedgerService reads a project's ledger: its numbered decisions, filed in
// directories. The ledger is read-only here; it changes only through
// changesets (LedgerChangesetService).
//
// Every call needs a browser session cookie (UNAUTHENTICATED without one)
// and is refused with PERMISSION_DENIED when its Origin header differs from
// the server's public URL. A project of another user is NOT_FOUND, like an
// unknown one. Invalid input is INVALID_ARGUMENT with a google.rpc.BadRequest
// field violation naming the field ("project_id", "number", "commit",
// "page_size" or "page_token").
//
// A project that has never had a decision has an empty ledger: GetLedger
// answers with no entries and an empty head_commit.
//
// Bounds: at most 4096 decisions per project; a decision file is at most
// 256 KiB; a title is at most 512 bytes; a directory is at most 256 bytes of
// '/'-separated segments of at most 64 bytes each.
service LedgerService {
  // GetLedger lists every decision on the ledger's main line, ordered by
  // path (directory, then file name).
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse);
  // GetDecision returns one decision, by default as it is now; with commit,
  // as it was at that commit of the main line (NOT_FOUND if the decision
  // did not exist there or the commit is not on the main line).
  rpc GetDecision(GetDecisionRequest) returns (GetDecisionResponse);
  // ListDecisionHistory lists the main-line commits that changed one
  // decision (its content, title or directory), newest first.
  rpc ListDecisionHistory(ListDecisionHistoryRequest) returns (ListDecisionHistoryResponse);

  // GetSessionLedger returns a session's ledger snapshot: its status, the
  // open changeset's changes as one entry per decision, the problems of
  // its last collection and the session's merged changesets. NOT_FOUND for
  // a session of another user's project, like an unknown one.
  rpc GetSessionLedger(GetSessionLedgerRequest) returns (GetSessionLedgerResponse);
  // GetSessionLedgerDiff returns one changed file of the session's open
  // changeset next to its version in the changeset's base, for showing a
  // diff. NOT_FOUND when the open changeset does not change that path.
  rpc GetSessionLedgerDiff(GetSessionLedgerDiffRequest) returns (GetSessionLedgerDiffResponse);
  // MergeSessionLedger merges the session's open changeset when it
  // fast-forwards, for the project's owner (no integrator is needed). It
  // first collects the snapshot from the device. FAILED_PRECONDITION with
  // a google.rpc.PreconditionFailure whose type is:
  //   - "TURN_RUNNING": a turn is running or about to start; merge after
  //     it ends;
  //   - "NOT_FAST_FORWARD": the base differs from the main line's head; an
  //     integrator merges it with `circus ledger merge` (the page shows it
  //     as waiting to be merged);
  //   - "DEVICE_OFFLINE": the device is offline and a turn ended after the
  //     last collection, so the changes on the device are not known yet;
  //   - "PROBLEMS": the changeset fails validation;
  //   - "NO_CHANGES": the session has no open changeset with changes;
  //   - "CHANGESET_CHANGED": expected_changeset_id is not the open one.
  // After merging, the control plane renames the session's new decisions
  // on the device (DeviceCall rebase_ledger) and tells the agent.
  rpc MergeSessionLedger(MergeSessionLedgerRequest) returns (MergeSessionLedgerResponse);
}

message LedgerEntry {
  // The decision is referred to as D<number>. Numbers are unique within a
  // project and never reused; 0 is a valid number.
  uint32 number = 1;
  string title = 2;
  // Directory relative to the ledger root, without leading or trailing
  // '/'; empty for the root.
  string dir = 3;
  // File path relative to the ledger root: "<dir>/D<number>-<name>.md".
  string path = 4;
  // Commit time of the last main-line commit that changed this decision.
  int64 updated_at_unix_ms = 5;
}

message GetLedgerRequest {
  string project_id = 1;
}
message GetLedgerResponse {
  // Full hex id of the main line's head commit; empty for an empty ledger.
  string head_commit = 1;
  repeated LedgerEntry entries = 2;
  // The number the next merged decision will get.
  uint32 next_number = 3;
}

message Decision {
  uint32 number = 1;
  string title = 2;
  string dir = 3;
  string path = 4;
  // Markdown body after the front matter, exactly as stored. It is written
  // by agents: render it as untrusted input, without raw HTML.
  string body = 5;
  // The main-line commit this version was read at, and its commit time.
  string commit = 6;
  int64 committed_at_unix_ms = 7;
}

message GetDecisionRequest {
  string project_id = 1;
  uint32 number = 2;
  // Optional full hex commit id on the main line; empty reads the head.
  string commit = 3;
}
message GetDecisionResponse {
  Decision decision = 1;
}

message DecisionVersion {
  // Full hex id of the main-line commit that made this version.
  string commit = 1;
  int64 committed_at_unix_ms = 2;
  // Commit author name: a session, a worker that merged a changeset, or
  // "import".
  string author = 3;
  // First line of the commit message.
  string summary = 4;
  // The decision's path and title in this version.
  string path = 5;
  string title = 6;
  // added is true only for the version that created the decision; the
  // other flags say what changed relative to the previous version and are
  // false when added is true.
  bool added = 7;
  bool content_changed = 8;
  bool moved = 9;
  bool retitled = 10;
  // Code commit merged together with this version, when there was one.
  string code_commit = 11;
}

message ListDecisionHistoryRequest {
  string project_id = 1;
  uint32 number = 2;
  // 1 to 100; 0 selects 50.
  uint32 page_size = 3;
  // next_page_token of the previous page; empty starts at the head.
  string page_token = 4;
}
message ListDecisionHistoryResponse {
  repeated DecisionVersion versions = 1;
  // Empty when there are no more versions.
  string next_page_token = 2;
}

// LedgerChangesetService changes a project's ledger through changesets: a
// changeset starts from a main-line commit (its base), carries the complete
// set of file changes relative to that base, and is either merged into the
// main line or discarded. The `circus ledger` command uses it.
//
// Every call needs "Authorization: Bearer <token>" with a worker
// credential (UNAUTHENTICATED otherwise, also for daemon credentials and
// browser cookies). The caller acts for the worker's user: a project of
// another user is NOT_FOUND, like an unknown one, and so is another user's
// changeset. Invalid input is INVALID_ARGUMENT with a google.rpc.BadRequest
// field violation.
//
// Who may do what:
//   - any worker of the user: OpenChangeset, ReadChangesetBase,
//     ListChangesets, GetChangeset;
//   - a session's changeset (session_id set) has no opener: only an
//     integrator may check, read conflicts of, merge or discard it;
//   - the worker that opened the changeset, or a worker with the integrator
//     grant (MachineService.SetWorkerGrant): CheckChangeset,
//     ReadChangesetConflicts, DiscardChangeset, and MergeChangeset when it
//     fast-forwards;
//   - only an integrator: MergeChangeset when it does not fast-forward.
// A refusal is PERMISSION_DENIED; when the integrator grant is what is
// missing, it carries google.rpc.ErrorInfo with reason
// "INTEGRATOR_REQUIRED".
//
// Files: paths are relative to the ledger root, '/'-separated, and name
// decision files "<dir>/D<n>-<name>.md" as on the main line. A new decision
// uses a temporary number "D?<letters>" (one to four lowercase ASCII
// letters, unique within the changeset) in its front matter, its file name
// and references in any changed file; merging assigns the next free
// numbers and rewrites them. The generated root INDEX.md is not a decision
// and is never part of a changeset.
//
// Fast-forward: a changeset fast-forwards when its base commit's tree
// equals the tree of the main line's head. A changeset opened here has a
// main-line commit as its base, so this is "the base is the head"; a
// session's later changeset has as its base the session's view after its
// earlier merge (a commit whose parent is that merge commit), which equals
// the main line until someone else merges.
//
// Sessions: a session with a ledger snapshot has at most one open
// changeset, opened by the control plane when a collection first finds
// changes. CheckChangeset on it takes no changes: it collects the snapshot
// from the device first, or, with the device offline, uses the last
// collection and says so in a warning. MergeChangeset and DiscardChangeset
// of it are refused with FAILED_PRECONDITION, violation type TURN_RUNNING,
// while a turn of the session runs or is about to start (its inputs are
// taken); once one succeeds, the session's turns
// wait until the snapshot follows (new decisions renamed, or the snapshot
// written again) and the agent is told.
//
// Bounds: as LedgerService, plus at most 8 MiB of changed file content per
// changeset and at most 64 open changesets per project, sessions' included
// (RESOURCE_EXHAUSTED beyond).
service LedgerChangesetService {
  // OpenChangeset starts a changeset based on the current head of the main
  // line, recording the calling worker as its opener.
  rpc OpenChangeset(OpenChangesetRequest) returns (OpenChangesetResponse);
  // ReadChangesetBase pages through the base commit's files, for writing
  // the changeset's local copy.
  rpc ReadChangesetBase(ReadChangesetBaseRequest) returns (ReadChangesetBaseResponse);
  // CheckChangeset replaces the changeset's content with changes (the
  // complete set relative to its base; calling it again with the same
  // changes changes nothing), validates it and compares it with the
  // current main line. Validation problems and conflicts are results, not
  // RPC errors. FAILED_PRECONDITION when the changeset is not open.
  rpc CheckChangeset(CheckChangesetRequest) returns (CheckChangesetResponse);
  // ReadChangesetConflicts pages through the conflicts of the changeset's
  // last check with all their contents (base, changeset, main line), for
  // conflicts a CheckChangeset reported with content_omitted. It changes
  // nothing. main_commit is the CheckChangeset's main_commit: the
  // conflicts are computed against it, and FAILED_PRECONDITION with a
  // google.rpc.PreconditionFailure of type "MAIN_LINE_MOVED" says the main
  // line moved since, so the caller checks again. A page token holds on
  // only with the same main_commit and while the changeset is not checked
  // again: otherwise FAILED_PRECONDITION with type "MAIN_LINE_MOVED" or
  // "CHANGESET_CHANGED". Also FAILED_PRECONDITION when the changeset is not
  // open.
  rpc ReadChangesetConflicts(ReadChangesetConflictsRequest) returns (ReadChangesetConflictsResponse);
  // MergeChangeset merges an open changeset into the main line, under the
  // project's lock, re-checking everything there:
  //   - it fast-forwards when its base's tree equals the tree of the main
  //     line's head at that moment; the opener may then merge it;
  //   - otherwise only an integrator may merge it, even when no file it
  //     changes was changed on the main line after its base, and every
  //     conflicting file must be given its final content in resolved.
  // A conflicting file is one the changeset changed that the main line
  // also changed after the base, even when the texts could be merged.
  // Merging assigns numbers, renames new decisions' files and rewrites
  // their temporary references, commits on the main line (one ordinary
  // commit; the main line stays linear), rebuilds the index and records
  // code_commit. It is idempotent: merging a merged changeset again
  // returns the same result. FAILED_PRECONDITION, with the problems in
  // google.rpc.PreconditionFailure, when validation fails, a conflict is
  // unresolved, or the changeset was discarded.
  rpc MergeChangeset(MergeChangesetRequest) returns (MergeChangesetResponse);
  // DiscardChangeset archives an open changeset with a reason. Discarding
  // a discarded changeset again is a no-op; a merged one is
  // FAILED_PRECONDITION.
  rpc DiscardChangeset(DiscardChangesetRequest) returns (DiscardChangesetResponse);
  // ListChangesets lists a project's changesets, newest first.
  rpc ListChangesets(ListChangesetsRequest) returns (ListChangesetsResponse);
  rpc GetChangeset(GetChangesetRequest) returns (GetChangesetResponse);
}

message Changeset {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_OPEN = 1;
    STATE_MERGED = 2;
    STATE_DISCARDED = 3;
  }
  string changeset_id = 1;
  string project_id = 2;
  State state = 3;
  // Main-line commit the changeset started from.
  string base_commit = 4;
  // The worker that opened it; empty for a session's changeset.
  string opener_worker_id = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
  // When merged: the main-line commit and the code commit given to merge.
  string merged_commit = 8;
  string code_commit = 9;
  // When discarded.
  string discard_reason = 10;
  // Set when an interrupted merge or archive of the changeset could not be
  // repaired, as when one of its objects is damaged: why, briefly.
  // GetChangeset and ListChangesets return such a changeset with the state
  // recorded before that merge or discard (open for an interrupted merge,
  // discarded for an archive not finished); its other operations are
  // refused with FAILED_PRECONDITION, a google.rpc.PreconditionFailure of
  // type "CHANGESET_REPAIR", until a repair succeeds.
  string repair_failure = 11;
  // The session whose snapshot it collects; empty for one opened with
  // OpenChangeset.
  string session_id = 12;
}

message LedgerFile {
  string path = 1;
  // Complete file content (UTF-8).
  string content = 2;
}

message FileChange {
  string path = 1;
  oneof change {
    // New or changed file: its complete content.
    string content = 2;
    // The file of the base is removed (decisions cannot be removed; this
    // is for moving or renaming one, together with its new path).
    bool deleted = 3;
  }
}

message OpenChangesetRequest {
  // A project id or the user's project name.
  string project = 1;
}
message OpenChangesetResponse {
  Changeset changeset = 1;
}

message ReadChangesetBaseRequest {
  string changeset_id = 1;
  // next_page_token of the previous page; empty starts at the first file.
  string page_token = 2;
}
message ReadChangesetBaseResponse {
  // Files of the base commit in path order, at most 8 MiB per page.
  repeated LedgerFile files = 1;
  // Empty after the last file.
  string next_page_token = 2;
}

message LedgerProblem {
  string path = 1;
  // English description for the agent, e.g. "front matter must hold
  // number and title".
  string message = 2;
}

message LedgerConflict {
  string path = 1;
  // The file in the base, the changeset and the current main line; a side
  // where it does not exist has exists false and empty content.
  bool base_exists = 2;
  string base = 3;
  bool changeset_exists = 4;
  string changeset = 5;
  bool main_exists = 6;
  string main = 7;
  // The three contents are left out, because the conflicts' contents
  // exceed what one response carries; the exists flags still hold.
  bool content_omitted = 8;
}

message CheckChangesetRequest {
  string changeset_id = 1;
  // The complete set of changes relative to the base. Empty for a
  // session's changeset, whose changes come from its snapshot
  // (INVALID_ARGUMENT otherwise).
  repeated FileChange changes = 2;
}
message CheckChangesetResponse {
  Changeset changeset = 1;
  repeated LedgerProblem problems = 2;
  // The base's tree is the main line head's tree now: merging needs no
  // integrator and has no conflicts (unless the main line moves first).
  bool fast_forward = 3;
  // Main-line head the comparison used.
  string main_commit = 4;
  repeated LedgerConflict conflicts = 5;
  // Findings that do not stop a merge, such as a reference to a temporary
  // number that no new decision of the changeset has, which a merge keeps
  // as it is.
  repeated LedgerProblem warnings = 6;
}

message ReadChangesetConflictsRequest {
  string changeset_id = 1;
  // The main_commit a CheckChangeset of the changeset reported.
  string main_commit = 2;
  // next_page_token of the previous page; empty starts at the first
  // conflict.
  string page_token = 3;
}
message ReadChangesetConflictsResponse {
  // Conflicts in path order with their contents, about 8 MiB per page; a
  // conflict whose contents alone exceed that comes alone in its page.
  // content_omitted is never set here.
  repeated LedgerConflict conflicts = 1;
  // Empty after the last conflict.
  string next_page_token = 2;
}

message MergeChangesetRequest {
  string changeset_id = 1;
  // Optional: the code commit merged together with this change (full hex).
  string code_commit = 2;
  // Final content for conflicting files (a deleted change resolves to the
  // file's absence). Ignored when the merge fast-forwards.
  repeated FileChange resolved = 3;
}
message MergeChangesetResponse {
  Changeset changeset = 1;
  // Temporary number ("D?a") to the assigned number, for new decisions.
  map<string, uint32> numbers = 2;
}

message DiscardChangesetRequest {
  string changeset_id = 1;
  // Required, at most 1024 bytes.
  string reason = 2;
}
message DiscardChangesetResponse {
  Changeset changeset = 1;
}

message ListChangesetsRequest {
  string project = 1;
  // Unspecified lists all states.
  Changeset.State state = 2;
  // 1 to 100; 0 selects 50.
  uint32 page_size = 3;
  string page_token = 4;
  // Only this session's changesets.
  string session_id = 5;
}
message ListChangesetsResponse {
  repeated Changeset changesets = 1;
  string next_page_token = 2;
}

message GetChangesetRequest {
  string changeset_id = 1;
}
message GetChangesetResponse {
  Changeset changeset = 1;
}

// SessionLedgerStatus is the state of a session's ledger snapshot: a copy
// of the project's ledger in a directory on the session's device, outside
// the workspace, that the session's agent reads and writes. The control
// plane prepares it when the session is created (the first turn waits for
// it while its device is offline or it is prepared, as for the workspace),
// collects its changes after every turn into the session's changeset, and
// between turns renames new decisions in it after a merge, or writes it
// again after a discard: turns are held until that is done and the agent
// is told. The snapshot never takes in others' later main-line changes.
message SessionLedgerStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Waiting for the device to connect. It holds the session's turns.
    STATE_PENDING = 1;
    // Preparation runs on the device; it holds the session's turns.
    STATE_PREPARING = 2;
    // The snapshot is at path.
    STATE_READY = 3;
    // Preparation failed; the session runs without a ledger. See error.
    STATE_FAILED = 4;
  }
  State state = 1;
  // Absolute device path once READY.
  string path = 2;
  // FAILED only.
  LedgerSnapshotError error = 3;
  // At most 1024 bytes of valid UTF-8.
  string error_detail = 4;
  // The last successful collection; zero before any.
  int64 collected_at_unix_ms = 5;
  // A turn ended after the last successful collection (the device was
  // offline, or the collection waits or runs): the device may hold changes
  // the control plane has not seen.
  bool collection_due = 6;
  // The open changeset, empty when none.
  string changeset_id = 7;
  // Entries and problems of the open changeset's last collection.
  uint32 change_count = 8;
  uint32 problem_count = 9;
  // Strictly increases on every change of this status; a KIND_LEDGER
  // event carries it as ts_unix_ms.
  int64 updated_at_unix_ms = 10;
  // A merge or a discard of the session's changeset being applied to the
  // snapshot (READY only). The session's turns wait for it, unless
  // problems stop it (problem_count): then the agent is told and the
  // step is tried again after its next turn.
  Applying applying = 11;
  enum Applying {
    // Nothing is being applied.
    APPLYING_UNSPECIFIED = 0;
    // The merge: new decisions are renamed in the snapshot.
    APPLYING_MERGE = 1;
    // The discard: the snapshot is written again.
    APPLYING_DISCARD = 2;
  }
}

// SessionLedgerEntry is one decision (or other file) the open changeset
// changes, relative to its base.
message SessionLedgerEntry {
  // Path in the changeset; for a deleted file, its path in the base.
  string path = 1;
  // Path in the base when it differs (moved or renamed); empty otherwise.
  string base_path = 2;
  // "D12", or a temporary "D?a" for a new decision; empty when the file
  // is not a decision file.
  string number = 3;
  // Title in the changeset, and in the base when it differs.
  string title = 4;
  string base_title = 5;
  // What changed; several may hold.
  bool added = 6;
  bool content_changed = 7;
  bool moved = 8;
  bool retitled = 9;
  bool deleted = 10;
  // The collection's problems for this path, in English (also listed in
  // GetSessionLedgerResponse.problems).
  repeated string problems = 11;
}

message GetSessionLedgerRequest {
  string session_id = 1;
}
message GetSessionLedgerResponse {
  SessionLedgerStatus status = 1;
  // The open changeset; unset when none.
  Changeset changeset = 2;
  // In path order, at most 4096.
  repeated SessionLedgerEntry entries = 3;
  // All problems of the last collection, including those without a path
  // (such as too many files). At most 256.
  repeated LedgerProblem problems = 4;
  repeated LedgerProblem warnings = 5;
  // The open changeset fast-forwards now, so MergeSessionLedger may merge
  // it; false means it waits for an integrator.
  bool fast_forward = 6;
  // The session's merged changesets, newest first, at most 64.
  repeated MergedSessionChangeset merged = 7;
}
message MergedSessionChangeset {
  Changeset changeset = 1;
  // Temporary number to assigned number, as MergeChangesetResponse.numbers.
  map<string, uint32> numbers = 2;
}

message GetSessionLedgerDiffRequest {
  string session_id = 1;
  // A SessionLedgerEntry.path.
  string path = 2;
}
message GetSessionLedgerDiffResponse {
  // The entry's file in the base (at base_path when moved) and in the
  // changeset; a side where it does not exist has exists false and empty
  // content. Each at most 256 KiB plus one byte: a longer file is cut and
  // marked truncated.
  bool base_exists = 1;
  string base = 2;
  bool base_truncated = 3;
  bool changeset_exists = 4;
  string changeset = 5;
  bool changeset_truncated = 6;
}

message MergeSessionLedgerRequest {
  string session_id = 1;
  // The open changeset the user saw (SessionLedgerStatus.changeset_id).
  string expected_changeset_id = 2;
}
message MergeSessionLedgerResponse {
  Changeset changeset = 1;
  map<string, uint32> numbers = 2;
}
