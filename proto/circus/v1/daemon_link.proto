syntax = "proto3";

package circus.v1;

import "circus/v1/device.proto";
import "circus/v1/link.proto";

option go_package = "github.com/EricWvi/circus/gen/go/circus/v1;circusv1";

// DaemonUplink is one daemon-to-control-plane WSS binary message.
// Physical frames are FIFO in each direction. Ack, result and job events have
// NO relative ordering: result may precede ack and implies acknowledgement;
// job events may precede results and must be associated by call_id. Job events
// within one boot are strictly increasing by seq. A rejected ack has no later
// result for that rejected submission. Duplicate accepted submits return the
// existing RUNNING or COMPLETED status (including the retained result).
// Pushes are disposable: disconnected pushes are dropped, a full outbound queue
// closes the link. There is no daemon outbox. Recover using CallQuery (results
// retained 30 minutes) and ListJobs, never event-log replay.
message DaemonUplink {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    Fragment fragment = 3;
    CallAck call_ack = 10;
    DeviceResult result = 11;
    CallStatus call_status = 12;
    JobEvent job_event = 13;
    JobSnapshot job_snapshot = 14;
    DeviceQueryResult device_query_result = 15;
    // Only for an UpdateMachine this daemon received.
    UpdateFailed update_failed = 16;
  }
}

// DaemonDownlink is one control-plane-to-daemon WSS binary message.
// No business message precedes Welcome. Every same-call DispatchCall,
// CancelCall and CallQuery shares an ordering key and is delivered FIFO,
// including resends. ListJobs and StopSessionJobs are barriers behind every
// earlier DispatchCall, including queued and partially written dispatches.
// Only heartbeats, GoAway and acknowledgements receive urgent control priority.
// Unrelated small business messages may bypass large ones with different keys;
// no business message bypasses a barrier. Fragmented controls obey in-flight caps.
message DaemonDownlink {
  oneof payload {
    Welcome welcome = 1;
    Reject reject = 2;
    Heartbeat heartbeat = 3;
    Fragment fragment = 4;
    GoAway go_away = 5;
    DispatchCall dispatch_call = 10;
    CancelCall cancel_call = 11;
    CallQuery call_query = 12;
    ListJobs list_jobs = 13;
    StopSessionJobs stop_session_jobs = 14;
    DeviceQuery device_query = 15;
    // Sent only to a daemon whose Hello.features lists "machine_update".
    UpdateMachine update_machine = 16;
  }
}

// DispatchCall fences execution to one daemon boot.
message DispatchCall {
  DeviceCall call = 1;
  // Required, equal to dispatched_boot_id committed before writing this call.
  // A daemon with a different boot_id must reject without executing.
  string target_boot_id = 2;
  // Required on the daemon link: the control plane's clock at dispatch commit.
  // A resend carries the original dispatch time, not the resend time.
  int64 dispatched_at_unix_ms = 3;
}

// CallAck reports Submit's immediate outcome, not necessarily before result.
message CallAck {
  // 1-128 bytes, charset [A-Za-z0-9_-]. Empty when an invalid call_id
  // cannot be echoed (for example, with Rejection.INVALID).
  string call_id = 1;
  // Exactly one outcome. Accepted duplicates report the existing status.
  oneof outcome {
    CallStatus status = 2;
    Rejection rejection = 3;
  }
}

// Rejection turns a submit error into a wire value; no result follows rejection.
message Rejection {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_BOOT_MISMATCH = 1;
    CODE_INVALID = 2;
    CODE_CALL_MISMATCH = 3;
    CODE_EXPIRED = 4;
    CODE_SHUTTING_DOWN = 5;
  }
  Code code = 1;
  string message = 2;
}

// ListJobs requests an atomic current-state snapshot, always after reconnect.
message ListJobs {
  // Empty means all sessions; otherwise 1-128 bytes, charset [A-Za-z0-9_-].
  string session_id = 1;
}

// JobSnapshot captures job states and the boot-wide sequence under one lock.
// Each entry is the current state, not a replay, with its last event seq <= seq.
// Discard subsequent stale events at or below this high-water mark. Snapshot
// replies can race with live events; receivers must not regress newer states.
message JobSnapshot {
  uint64 seq = 1;
  repeated JobEvent jobs = 2;
  // The snapshot omitted jobs to fit its resource caps. Receivers MUST NOT
  // infer anything from omissions when true, including marking jobs LOST.
  // RUNNING jobs are included first, then ended jobs in job-ID order.
  bool truncated = 3;
}

// StopSessionJobs exposes idempotent session job stopping; there is no
// session orchestration yet. It does not cancel foreground calls.
message StopSessionJobs {
  // Required: 1-128 bytes, charset [A-Za-z0-9_-].
  string session_id = 1;
}

// DeviceQuery is a read-only request the control plane makes on its own,
// outside any session (for example, browsing directories while editing a
// project). It is not persisted, deduplicated, fenced to a boot or resent:
// if the link closes before the result arrives, the control plane fails the
// request. It has no ordering relative to calls, ListJobs or
// StopSessionJobs and is never a barrier. The daemon answers every
// DeviceQuery it receives with exactly one DeviceQueryResult carrying the same
// request_id, including queries it cannot parse or does not support. The
// control plane sends a query type only to a daemon whose Hello.features
// lists it.
message DeviceQuery {
  // Required: 1-128 bytes, charset [A-Za-z0-9_-]; unique among the link's
  // outstanding queries.
  string request_id = 1;
  oneof query {
    ListDirectoryQuery list_directory = 10;
    GitRemoteQuery git_remote = 11;
  }
}

// DeviceQueryResult answers one DeviceQuery.
message DeviceQueryResult {
  string request_id = 1;
  // Exactly one outcome.
  oneof outcome {
    DeviceQueryError error = 2;
    ListDirectoryResult list_directory = 10;
    GitRemoteResult git_remote = 11;
  }
}

// DeviceQueryError reports that the daemon did not run a query.
message DeviceQueryError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    // Malformed query, such as a missing request_id or an empty oneof.
    CODE_INVALID = 1;
    // The daemon does not know this query type.
    CODE_UNSUPPORTED = 2;
    // Too many queries are running on the daemon; retry later.
    CODE_BUSY = 3;
    // The daemon is shutting down.
    CODE_SHUTTING_DOWN = 4;
  }
  Code code = 1;
  string message = 2;
}

// ListDirectoryQuery lists the subdirectories of one directory on the device.
message ListDirectoryQuery {
  // Empty means the daemon user's home directory. "~" and a leading "~/"
  // expand to that home directory. Otherwise an absolute path; a relative
  // path is DIRECTORY_ERROR_INVALID_PATH. At most 4096 bytes.
  string path = 1;
  // Also list directories whose names start with ".".
  bool include_hidden = 2;
}

// ListDirectoryResult is the outcome of one ListDirectoryQuery.
message ListDirectoryResult {
  // The listed directory: absolute and lexically cleaned (no trailing
  // separator except at the root; "." and ".." removed). Symbolic links in it
  // are not resolved. Set even when error is set, if the path could be
  // resolved.
  string path = 1;
  // Parent of path (lexically); empty at the root.
  string parent = 2;
  // The daemon user's home directory, empty if unknown or not valid UTF-8.
  // A path that requires an unavailable home yields INVALID_PATH.
  string home = 3;
  // Subdirectories (including symbolic links to directories), sorted by name
  // in byte order. Empty when error is set. Names that are not valid UTF-8
  // are omitted and count only toward the raw entry limit.
  repeated DirectoryEntry entries = 4;
  // entries were capped at 1000, or the daemon stopped reading the directory
  // after 20000 raw entries. Entries kept are the first by name among those read.
  bool truncated = 5;
  // UNSPECIFIED when the directory was listed; otherwise why it was not.
  DirectoryError error = 6;
}

message DirectoryEntry {
  // Base name, without separators.
  string name = 1;
  // Best effort: true when a ".git" entry (directory or file) was found.
  // False also covers entries the daemon could not check.
  bool git_repository = 2;
  // Best effort: a symbolic link to a directory or an unchecked symbolic
  // link whose target may not be a directory.
  bool symlink = 3;
}

enum DirectoryError {
  DIRECTORY_ERROR_UNSPECIFIED = 0;
  // The path is relative, too long, or contains NUL.
  DIRECTORY_ERROR_INVALID_PATH = 1;
  DIRECTORY_ERROR_NOT_FOUND = 2;
  DIRECTORY_ERROR_NOT_DIRECTORY = 3;
  DIRECTORY_ERROR_PERMISSION_DENIED = 4;
  // Reading took longer than the daemon's limit (such as a hung network mount).
  DIRECTORY_ERROR_TIMEOUT = 5;
  // Any other I/O error; ListDirectoryResult has no message, see daemon logs.
  DIRECTORY_ERROR_IO = 6;
}

// GitRemoteQuery reads the fetch URL of the "origin" remote of the git
// repository containing a directory on the device, as
// `git -C <path> remote get-url origin` prints it (after url.insteadOf
// rewriting). The daemon runs git without a terminal prompt and with a
// five-second limit. Daemon feature: "device_query.git_remote".
message GitRemoteQuery {
  // As ListDirectoryQuery.path: empty or "~" is the daemon user's home
  // directory, "~/x" is under it, anything else must be absolute. At most
  // 4096 bytes, UTF-8.
  string path = 1;
}

// GitRemoteResult is the outcome of one GitRemoteQuery.
message GitRemoteResult {
  // The origin URL with surrounding whitespace removed; set only when error
  // is UNSPECIFIED. At most 2048 bytes of UTF-8. For scheme:// URLs, passwords
  // are removed, and HTTP(S) and FTP(S) URLs have all userinfo removed.
  // SCP-style URLs keep their user.
  string url = 1;
  // UNSPECIFIED when url was read; otherwise why not.
  GitRemoteError error = 2;
}

enum GitRemoteError {
  GIT_REMOTE_ERROR_UNSPECIFIED = 0;
  // The path is relative, too long, contains NUL, or the home directory is
  // unknown for a "~" path.
  GIT_REMOTE_ERROR_INVALID_PATH = 1;
  // The path does not exist or is not a directory.
  GIT_REMOTE_ERROR_NOT_FOUND = 2;
  // The directory is not inside a git work tree.
  GIT_REMOTE_ERROR_NOT_REPOSITORY = 3;
  // The repository has no "origin" remote, or its URL is empty.
  GIT_REMOTE_ERROR_NO_ORIGIN = 4;
  // git is not installed or not on the daemon's PATH.
  GIT_REMOTE_ERROR_GIT_UNAVAILABLE = 5;
  // git did not finish within the daemon's limit.
  GIT_REMOTE_ERROR_TIMEOUT = 6;
  // Anything else, including a URL that is not valid UTF-8 or too long; see
  // the daemon logs.
  GIT_REMOTE_ERROR_FAILED = 7;
}
