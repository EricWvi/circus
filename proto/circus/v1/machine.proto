syntax = "proto3";

package circus.v1;

import "circus/v1/agent.proto";
import "circus/v1/daemon_link.proto";

option go_package = "github.com/EricWvi/circus/gen/go/circus/v1;circusv1";

// MachineService lists and enrolls machines for the signed-in browser user.
// It needs a browser session cookie (UNAUTHENTICATED without one) and
// follows the same Origin rule as ProjectService.
service MachineService {
  // The caller's devices, ordered by name.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // The caller's workers that are not deleted, ordered by name.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  // Issues a one-time enrollment link for the caller's machines. Any
  // signed-in user may call it. Tokens are returned only here; the server
  // stores only their hashes.
  rpc CreateEnrollLink(CreateEnrollLinkRequest) returns (CreateEnrollLinkResponse);
  // Turns a grant of one of the caller's workers on or off and returns the
  // worker. NOT_FOUND for another user's or an unknown worker.
  rpc SetWorkerGrant(SetWorkerGrantRequest) returns (SetWorkerGrantResponse);
  // Installs or uninstalls an agent on one of the caller's workers and
  // returns the worker. The wish is stored and pushed to the worker when it
  // is online (else at its next attach); the worker reports progress, seen
  // in ListWorkers. install=true when the agent is INSTALLED at the
  // worker's target version is a no-op; when it is OUTDATED, FAILED or not
  // installed, it (re)installs the worker's target version. Errors:
  // NOT_FOUND for another user's or an unknown worker; INVALID_ARGUMENT for
  // AGENT_KIND_UNSPECIFIED or an agent the worker does not support (absent
  // from its reported agents); FAILED_PRECONDITION for install=true while
  // the worker never reported (no target version yet), and for
  // install=false while the worker holds a lease of a session that runs
  // this agent.
  rpc SetWorkerAgent(SetWorkerAgentRequest) returns (SetWorkerAgentResponse);
  // Lists the subdirectories of a directory on one of the caller's devices,
  // asking its daemon live. Errors: NOT_FOUND for an unknown device;
  // FAILED_PRECONDITION when the device is offline; UNAVAILABLE when its link
  // closes before the answer, or the daemon does not support the query
  // (older version); DEADLINE_EXCEEDED after 10 seconds without an answer;
  // RESOURCE_EXHAUSTED when the caller already has 8 directory requests in
  // flight or the daemon is busy. Problems with the path itself are not RPC
  // errors: they come back in ListDirectoryResponse.result.error.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  // Reads the origin remote URL of the git repository at a directory on one
  // of the caller's devices, asking its daemon live. RPC errors are the same
  // as ListDirectory's (the 8-request per-user cap is shared with it), with
  // UNAVAILABLE also when the daemon does not list
  // "device_query.git_remote". Problems with the path or repository come
  // back in GetGitRemoteResponse.result.error.
  rpc GetGitRemote(GetGitRemoteRequest) returns (GetGitRemoteResponse);
  // Deletes one of the caller's devices as `circus server device revoke`
  // does: its credentials are revoked (a live daemon link closes at its
  // next credential check, within seconds), the device is removed and its
  // name freed, and project locations on it read as removed. The worker on
  // the same machine is untouched. NOT_FOUND for another user's, an
  // unknown or an already deleted device.
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  // Deletes one of the caller's workers as `circus server worker revoke`
  // does: as DeleteDevice, and the worker also leaves every provider it was
  // assigned to and loses its integrator grant. NOT_FOUND as DeleteDevice.
  rpc DeleteWorker(DeleteWorkerRequest) returns (DeleteWorkerResponse);
}

message Device {
  string name = 1;
  // A daemon link is connected now.
  bool online = 2;
  // Now if online; otherwise the later of the last connect and the last
  // disconnect. Zero means the device has never connected.
  int64 last_seen_unix_ms = 3;
  // GOOS and GOARCH values reported at enrollment, such as "linux" and
  // "amd64"; may be empty.
  string os = 4;
  string arch = 5;
  // Daemon client version reported at enrollment.
  string version = 6;
  // The device identity's id. A device that rejoins (or is revoked and
  // enrolled again) under the same name has a new one.
  string device_id = 7;
}
message ListDevicesRequest {}
message ListDevicesResponse {
  repeated Device devices = 1;
}
message Worker {
  string worker_id = 1;
  // Unique among the user's workers.
  string name = 2;
  // A worker link is connected now.
  bool online = 3;
  // As Device.last_seen_unix_ms.
  int64 last_seen_unix_ms = 4;
  string os = 5;
  string arch = 6;
  string hostname = 7;
  // Worker client version.
  string version = 8;
  // Names of the user's devices on the same machine: sessions in their
  // locations run in local mode on this worker.
  repeated string local_devices = 9;
  // The integrator grant: the worker's credential may merge ledger
  // changesets that do not fast-forward and discard changesets it did not
  // open, for this user's projects (LedgerChangesetService). Off by
  // default; it ends with the credential.
  bool integrator = 10;
  // One entry per agent the worker reported or the user asked for, ordered
  // by AgentKind.
  repeated WorkerAgent agents = 11;
}
message ListWorkersRequest {}

message SetWorkerGrantRequest {
  string worker_id = 1;
  bool integrator = 2;
}
message SetWorkerGrantResponse {
  Worker worker = 1;
}

message SetWorkerAgentRequest {
  string worker_id = 1;
  AgentKind agent = 2;
  bool install = 3;
}
message SetWorkerAgentResponse {
  Worker worker = 1;
}
message ListWorkersResponse {
  repeated Worker workers = 1;
}

message DeleteDeviceRequest {
  string device_id = 1;
}
message DeleteDeviceResponse {}
message DeleteWorkerRequest {
  string worker_id = 1;
}
message DeleteWorkerResponse {}

message CreateEnrollLinkRequest {
  // Which identities the link enrolls. Unspecified is INVALID_ARGUMENT.
  EnrollRole role = 1;
  // Rejoin: the id of one of the caller's devices (role DAEMON) or workers
  // (role WORKER) that the enrolled identity replaces under its name. The
  // enrollment revokes it as DeleteDevice or DeleteWorker would, and is
  // refused while it is online. INVALID_ARGUMENT with role BOTH; NOT_FOUND
  // for another user's, an unknown or a deleted identity.
  string replace_id = 2;
}
enum EnrollRole {
  ENROLL_ROLE_UNSPECIFIED = 0;
  ENROLL_ROLE_DAEMON = 1;
  ENROLL_ROLE_WORKER = 2;
  ENROLL_ROLE_BOTH = 3;
}
message CreateEnrollLinkResponse {
  // <public_url>/join#<token>[.<token>], as printed by the CLI. A link for
  // both roles carries the daemon token first.
  string link = 1;
  int64 expires_unix_ms = 2;
  // The control plane's build version (such as "v0.1.0" or "dev") for
  // selecting the matching CLI release.
  string server_version = 3;
}

message ListDirectoryRequest {
  // Name of one of the caller's devices.
  string device = 1;
  // As ListDirectoryQuery.path: empty or "~" is the home directory, "~/x" is
  // under it, anything else must be absolute. At most 4096 bytes.
  string path = 2;
  bool include_hidden = 3;
}
message ListDirectoryResponse {
  // The daemon's ListDirectoryResult, passed through.
  ListDirectoryResult result = 1;
}

message GetGitRemoteRequest {
  // Name of one of the caller's devices.
  string device = 1;
  // As ListDirectoryRequest.path.
  string path = 2;
}
message GetGitRemoteResponse {
  // The daemon's GitRemoteResult, passed through.
  GitRemoteResult result = 1;
}
