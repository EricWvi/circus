syntax = "proto3";

package circus.v1;

import "circus/v1/daemon_link.proto";

option go_package = "github.com/EricWvi/circus/gen/go/circus/v1;circusv1";

// MachineService lists and enrolls machines for the signed-in browser user.
// It needs a browser session cookie (UNAUTHENTICATED without one) and
// follows the same Origin rule as ProjectService.
service MachineService {
  // The caller's devices, ordered by name.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // Issues a one-time enrollment link for the caller's machines. Any
  // signed-in user may call it. Tokens are returned only here; the server
  // stores only their hashes.
  rpc CreateEnrollLink(CreateEnrollLinkRequest) returns (CreateEnrollLinkResponse);
  // Lists the subdirectories of a directory on one of the caller's devices,
  // asking its daemon live. Errors: NOT_FOUND for an unknown device;
  // FAILED_PRECONDITION when the device is offline; UNAVAILABLE when its link
  // closes before the answer, or the daemon does not support the query
  // (older version); DEADLINE_EXCEEDED after 10 seconds without an answer;
  // RESOURCE_EXHAUSTED when the caller already has 8 directory requests in
  // flight or the daemon is busy. Problems with the path itself are not RPC
  // errors: they come back in ListDirectoryResponse.result.error.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  // Reads the origin remote URL of the git repository at a directory on one
  // of the caller's devices, asking its daemon live. RPC errors are the same
  // as ListDirectory's (the 8-request per-user cap is shared with it), with
  // UNAVAILABLE also when the daemon does not list
  // "device_query.git_remote". Problems with the path or repository come
  // back in GetGitRemoteResponse.result.error.
  rpc GetGitRemote(GetGitRemoteRequest) returns (GetGitRemoteResponse);
}

message Device {
  string name = 1;
  // A daemon link is connected now.
  bool online = 2;
  // Now if online; otherwise the later of the last connect and the last
  // disconnect. Zero means the device has never connected.
  int64 last_seen_unix_ms = 3;
  // GOOS and GOARCH values reported at enrollment, such as "linux" and
  // "amd64"; may be empty.
  string os = 4;
  string arch = 5;
  // Daemon client version reported at enrollment.
  string version = 6;
}
message ListDevicesRequest {}
message ListDevicesResponse {
  repeated Device devices = 1;
}

message CreateEnrollLinkRequest {
  // Which identities the link enrolls. Unspecified is INVALID_ARGUMENT.
  EnrollRole role = 1;
}
enum EnrollRole {
  ENROLL_ROLE_UNSPECIFIED = 0;
  ENROLL_ROLE_DAEMON = 1;
  ENROLL_ROLE_WORKER = 2;
  ENROLL_ROLE_BOTH = 3;
}
message CreateEnrollLinkResponse {
  // <public_url>/join#<token>[.<token>], as printed by the CLI. A link for
  // both roles carries the daemon token first.
  string link = 1;
  int64 expires_unix_ms = 2;
  // The control plane's build version (such as "v0.1.0" or "dev") for
  // selecting the matching CLI release.
  string server_version = 3;
}

message ListDirectoryRequest {
  // Name of one of the caller's devices.
  string device = 1;
  // As ListDirectoryQuery.path: empty or "~" is the home directory, "~/x" is
  // under it, anything else must be absolute. At most 4096 bytes.
  string path = 2;
  bool include_hidden = 3;
}
message ListDirectoryResponse {
  // The daemon's ListDirectoryResult, passed through.
  ListDirectoryResult result = 1;
}

message GetGitRemoteRequest {
  // Name of one of the caller's devices.
  string device = 1;
  // As ListDirectoryRequest.path.
  string path = 2;
}
message GetGitRemoteResponse {
  // The daemon's GitRemoteResult, passed through.
  GitRemoteResult result = 1;
}
