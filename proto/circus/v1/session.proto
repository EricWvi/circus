syntax = "proto3";

package circus.v1;

import "circus/v1/workspace.proto";

option go_package = "github.com/EricWvi/circus/gen/go/circus/v1;circusv1";

// SessionService is the user-facing session API. Every call authenticates a
// browser session cookie and refuses an Origin different from the server's
// public URL, as ProjectService does. A Bearer credential for the CLI comes
// later. Workers use the worker link for session operations instead.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc WatchSession(WatchSessionRequest) returns (stream SessionEvent);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // GetSession and UpdateSession deliberately share the Session snapshot.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetSession(GetSessionRequest) returns (Session);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc UpdateSession(UpdateSessionRequest) returns (Session);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc ResolveApproval(ResolveApprovalRequest) returns (ResolveApprovalResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc RecoverSession(RecoverSessionRequest) returns (RecoverSessionResponse);
  rpc RetryWorkspace(RetryWorkspaceRequest) returns (RetryWorkspaceResponse);
}

// SessionConfig is reused unchanged when creating a session and acquiring it.
// Session, approval, input, message and worker ids are at most 128 bytes
// throughout this service.
message SessionConfig {
  // User-unique device name (at most 128 bytes) used when a tool does not
  // name a device.
  string default_device = 1;
  // Initial main-thread working directories, at most 256, one per device.
  repeated Cwd cwds = 2;
  // At most 128 bytes. Empty starts the CLI without a model, so it uses its
  // default alias, which the provider's ANTHROPIC_DEFAULT_*_MODEL variables
  // may map to a model id.
  string model = 3;
  // SDK permission mode, at most 128 bytes; empty selects auto.
  string permission_mode = 4;
  // Local mode: the session is pinned to a worker on the same machine as
  // default_device, and the worker runs Claude Code's built-in tools there
  // directly, in cwds' entry for default_device, instead of calling the
  // device. Set by the control plane when it creates the session (a worker
  // of the session's user shares the device's machine) and never changed;
  // CreateSession refuses it set by the client.
  bool local = 5;
  message Cwd {
    // At most 128 bytes.
    string device = 1;
    // Absolute device path, at most 4 KiB.
    string cwd = 2;
  }
}

// InputPriority controls input delivery even while a turn is running.
enum InputPriority {
  INPUT_PRIORITY_UNSPECIFIED = 0;
  // Default: merge into the current turn, or start one if idle.
  INPUT_PRIORITY_NORMAL = 1;
  // Interrupt the current turn before processing this input.
  INPUT_PRIORITY_NOW = 2;
}

enum TurnOrigin {
  TURN_ORIGIN_UNSPECIFIED = 0;
  TURN_ORIGIN_INPUT = 1;
  TURN_ORIGIN_NOTIFICATION = 2;
  // The CLI started the turn itself, for example on subagent completion.
  TURN_ORIGIN_CLI = 3;
}

enum TurnOutcome {
  TURN_OUTCOME_UNSPECIFIED = 0;
  TURN_OUTCOME_COMPLETED = 1;
  // An unfinished turn was closed without a confirmed user-stop report,
  // including lease loss or a successor starting before ENDED arrived.
  // This does not establish which transcript entries were saved.
  TURN_OUTCOME_INTERRUPTED = 2;
  TURN_OUTCOME_ERROR = 3;
  // The worker observed an abort caused by Interrupt or INPUT_PRIORITY_NOW
  // and its fenced ENDED report was accepted. Does not stop the session
  // or guarantee that partial assistant text was saved.
  TURN_OUTCOME_STOPPED = 4;
}

// Session state and lease ownership are independent: an idle session can have
// a live CLI and a lease, including while an asynchronous subagent runs.
message Session {
  string session_id = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_IDLE = 1;
    // Pending input or a completed unnotified job, without a valid lease.
    STATE_QUEUED = 2;
    // A CLI turn of any origin is running.
    STATE_RUNNING = 3;
    STATE_STOPPED = 4;
    // Transcript mirroring failed and has not been repaired. The holder may
    // repair it; otherwise it stays broken until the user accepts the gap
    // with RecoverSession or stops the session. In the measured cases (whole
    // turns, single entries and the tail missing) the CLI resumes without
    // error and silently omits the lost entries, so the session is kept from
    // running until the gap is repaired or accepted.
    STATE_BROKEN = 5;
  }
  State state = 2;
  // Outcome of the last ended turn; unchanged by STARTED or an interrupt request.
  TurnOutcome last_turn_outcome = 3;
  uint64 turn_count = 4;
  int64 created_at_unix_ms = 5;
  // Zero until stopped.
  int64 stopped_at_unix_ms = 6;
  // Unset in ListSessions results; GetSession returns it.
  SessionConfig config = 7;
  // The 64 MiB durable view filled; only turn boundaries continue to be stored.
  bool view_truncated = 8;
  // Empty permits scheduling on any attached worker belonging to the user.
  string pinned_worker_id = 9;
  // The project the session was created in.
  string project_id = 10;
  // Shown in session lists. Set from the first user message unless
  // UpdateSession set it first; empty until then.
  string title = 11;
  // Maximum timestamp of creation, durable events and accepted user inputs.
  int64 last_activity_at_unix_ms = 12;
  // Pending, unexpired approvals (at most 32).
  uint32 pending_approval_count = 13;
  // Set only for a session created in a project's default location: the
  // workspace on its device. Until it is READY the session runs no turn
  // (it stays IDLE or QUEUED; inputs are kept) and its cwd is the
  // placeholder "~/circus/projects/<project_id>"; when it becomes READY
  // the cwd becomes the absolute path.
  WorkspaceStatus workspace = 14;
  // The provider whose credentials and environment the CLI starts with;
  // empty means local login: the worker's own Claude Code login and
  // environment (a resumed session may find that login expired). May name
  // a deleted provider (see queue_reason).
  string provider_id = 15;
  // Why a QUEUED session is not running yet; UNSPECIFIED otherwise, and
  // also while it simply waits for a worker to take it. Kept by the
  // control plane in memory, not stored: after a control-plane start it is
  // UNSPECIFIED until the scheduler next evaluates the session. Changes
  // are announced live with KIND_QUEUE events.
  QueueReason queue_reason = 16;
  // Nonzero while the worker holding the session's lease is disconnected:
  // the time the last connection of the boot that holds the lease closed,
  // until that lease is bound to a live connection again (the worker
  // reconnected and resumed it) or ends. The lease stays valid until it
  // expires, 40 to 60 seconds after the disconnect, so the worker can
  // reconnect and keep its turn; if it does not, the lease expires and a
  // running turn is interrupted. Zero when the holder is connected, when no
  // lease is held, and when unknown. Kept by the control plane in memory,
  // not stored: after a control-plane start it is zero until a holder
  // disconnects again. Changes are announced live with KIND_WORKER events.
  int64 worker_disconnected_at_unix_ms = 17;
}

// QueueReason says why a queued session cannot be leased now.
enum QueueReason {
  QUEUE_REASON_UNSPECIFIED = 0;
  // The provider's max_sessions sessions hold leases already.
  QUEUE_REASON_PROVIDER_FULL = 1;
  // No online worker may run it: none of the provider's workers is online,
  // or the session is pinned to a worker the provider is not assigned to.
  QUEUE_REASON_NO_ASSIGNED_WORKER = 2;
  // The provider was deleted; pick another with UpdateSession.
  QUEUE_REASON_PROVIDER_DELETED = 3;
  // The provider's secrets cannot be decrypted; enter them again.
  QUEUE_REASON_PROVIDER_SECRETS_UNREADABLE = 4;
  // The pinned worker (or, unpinned, every worker of the user) is offline.
  QUEUE_REASON_WORKER_OFFLINE = 5;
}

// SessionEvent is the user-facing view, not the authoritative transcript.
// Durable events have increasing seq; ephemeral events are live-only, have
// seq = 0 and cannot be replayed. after_seq refers only to durable events.
message SessionEvent {
  uint64 seq = 1;
  int64 ts_unix_ms = 2;
  // Shared with worker-published events. TURN_STARTED payload includes origin.
  // Kinds 8, 9, 10, 15, 17, 18, 19, 20 and 21 are recorded by the control
  // plane only: a worker event batch containing one of them is dropped as
  // INVALID.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TURN_STARTED = 1;
    KIND_ASSISTANT = 2;
    // An SDK user message a worker publishes. The user's own messages enter
    // the view as INPUT_ACCEPTED.
    KIND_USER = 3;
    KIND_TOOL_PROGRESS = 4;
    KIND_RESULT = 5;
    KIND_PERMISSION_DENIED = 6;
    KIND_APPROVAL_PENDING = 7;
    // Recorded by the control plane only, when the user resolves an
    // approval.
    KIND_APPROVAL_RESOLVED = 8;
    // Control-plane-only durable boundary for a turn ending INTERRUPTED.
    // payload_json: {"turn_no":"<uint64>","outcome":"interrupted"}.
    KIND_TURN_INTERRUPTED = 9;
    // Recorded by the control plane only. A stop records
    // {"state":"stopped","reason":"user"} (StopSession) or
    // {"state":"stopped","reason":"transcript_full"} (the transcript quota).
    KIND_SESSION_STATE = 10;
    KIND_BGTASK_STARTED = 11;
    KIND_BGTASK_ENDED = 12;
    KIND_NOTIFICATION_DELIVERED = 13;
    KIND_ERROR = 14;
    // Recorded by the control plane only: the user accepted that the
    // transcript has a gap. A worker batch containing it is INVALID.
    KIND_TRANSCRIPT_GAP_ACCEPTED = 15;
    // Published by a worker that found a hole in the loaded transcript (an
    // unknown parentUuid) while Lease.transcript_gap_turn_no is nonzero, for
    // the user's view only; the payload names the subpath and the unknown
    // parents.
    KIND_TRANSCRIPT_GAP_DETECTED = 16;
    // Control-plane-only durable boundary for a turn ending STOPPED.
    // payload_json: {"turn_no":"<uint64>","outcome":"stopped"}.
    KIND_TURN_STOPPED = 17;
    // Recorded by the control plane only, when SendMessage accepts a new
    // input; SendMessageResponse.event_seq is its seq. payload_json:
    // {"input_id":..., "client_msg_id":..., "priority":..., "text":...}.
    KIND_INPUT_ACCEPTED = 18;
    // Recorded by the control plane only, for sessions with a workspace:
    // its status changed. Durable for state changes; ephemeral (seq 0) when
    // only waiting or background changed. ts_unix_ms equals the status's
    // new updated_at_unix_ms. payload_json:
    // {"state","waiting","device","path","repo_url","background","action",
    // "error","error_detail"} with the lower-case names of WorkspaceStatus
    // values ("pending", "device_offline", "cloned", "not_empty", ...),
    // at most 4 KiB.
    KIND_WORKSPACE = 19;
    // Recorded by the control plane only, always ephemeral (seq 0): the
    // session's queue_reason changed. payload_json:
    // {"queue_reason":"<lower-case name without prefix>"}, for example
    // {"queue_reason":"provider_full"}; "unspecified" when it cleared.
    KIND_QUEUE = 20;
    // Recorded by the control plane only, always ephemeral (seq 0): the
    // session's worker_disconnected_at_unix_ms changed. payload_json:
    // {"disconnected_at_unix_ms":"<int64>"}, "0" when the holder reconnected
    // or the lease ended.
    KIND_WORKER = 21;
  }
  Kind kind = 3;
  // Opaque SDK message JSON; durable view payloads over 256 KiB are truncated.
  string payload_json = 4;
  bool ephemeral = 5;
  bool truncated = 6;
}

message CreateSessionRequest {
  // config.default_device and config.cwds must be empty: the control
  // plane fills them from the project location. model and
  // permission_mode may be set.
  SessionConfig config = 1;
  optional string pinned_worker_id = 2;
  // Required: a project of the caller.
  string project_id = 3;
  // Index into the project's locations; unset uses the project's
  // last_used_location. The location's device must not be revoked.
  optional uint32 location_index = 4;
  // Required, 1 to 128 bytes: a client-chosen key (a UUID, say) that
  // makes retries safe. Repeating (project_id, client_request_id) returns
  // the session the first request created, without checking the device or
  // the session cap again, as long as the request also repeats
  // location_index, pinned_worker_id and config (ALREADY_EXISTS otherwise).
  // The key is forgotten when its session is deleted.
  string client_request_id = 5;
  // Absent: the project's default_provider_id, else the user's default
  // provider, else local login (a default naming a deleted provider counts
  // as unset). "" chooses local login. Otherwise one of the caller's
  // providers that is not deleted (INVALID_ARGUMENT with field
  // "provider_id" otherwise). A local session's pinned worker need not be
  // assigned to it: the session then queues with
  // QUEUE_REASON_NO_ASSIGNED_WORKER. Part of the idempotent repeat as
  // config is.
  optional string provider_id = 6;
}
message CreateSessionResponse {
  Session session = 1;
}

// At most 32 inputs per session may remain unpersisted, each at most 256 KiB.
// Repeating (session_id, client_msg_id) returns the same input_id and event_seq
// without inserting another input. Clients must retain identical content.
// A stopped session refuses new messages. A broken session accepts them, but
// they are not delivered until its transcript is repaired.
message SendMessageRequest {
  string session_id = 1;
  string client_msg_id = 2;
  string text = 3;
  InputPriority priority = 4;
}
message SendMessageResponse {
  string input_id = 1;
  // The seq of the INPUT_ACCEPTED event recorded with the input.
  uint64 event_seq = 2;
}
message WatchSessionRequest {
  string session_id = 1;
  // Replay durable events strictly after this sequence, then follow live events.
  uint64 after_seq = 2;
}
// ListSessions orders by last_activity_at descending, then session_id descending.
message ListSessionsRequest {
  // Zero selects 100; maximum 1000.
  uint32 page_size = 1;
  string page_token = 2;
  // Optional filter.
  string project_id = 3;
}
message ListSessionsResponse {
  // At most 1000, without config; a user may have at most 1000 sessions.
  repeated Session sessions = 1;
  string next_page_token = 2;
}
message GetSessionRequest {
  string session_id = 1;
}
// UpdateSessionRequest changes the fields that are set; at least one must
// be.
message UpdateSessionRequest {
  string session_id = 1;
  // Trimmed; 1 to 200 characters after trimming, at most 1024 bytes.
  optional string title = 2;
  // "" chooses local login; otherwise one of the caller's providers that
  // is not deleted. Refused with FAILED_PRECONDITION while a turn runs
  // (state RUNNING) and for a stopped session. When the session holds a
  // lease and no turn runs, a change of provider revokes that lease, as
  // lease loss does, and the session is scheduled again under the new
  // provider's workers and max_sessions; inputs and events are kept. The
  // next CLI the session starts uses the new provider.
  optional string provider_id = 3;
}

// Approval requests merge while pending by (session, tool, device, match_key),
// ignoring display, reason and tool_use_id. match_key is the SHA-256 of the
// matched command or path in 64 lowercase hexadecimal digits, so display is
// what a user reads (at most 1024 bytes, as reason). Pending requests and
// unused grants each have a cap of 32 per session and expire after ten
// minutes.
message SessionApproval {
  string approval_id = 1;
  string session_id = 2;
  string tool_use_id = 3;
  string agent_id = 4;
  string tool = 5;
  string device = 6;
  string match_key = 7;
  string display = 8;
  string reason = 9;
  int64 created_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
}
message ListApprovalsRequest {
  string session_id = 1;
}
message ListApprovalsResponse {
  // Pending approvals only, at most 32.
  repeated SessionApproval approvals = 1;
}
// Resolving an already resolved approval is idempotent and creates no additional
// grant or input. Approval of a stopped session is refused. Approving atomically
// creates one grant and an approval input asking the model to retry.
message ResolveApprovalRequest {
  string approval_id = 1;
  bool approve = 2;
}
message ResolveApprovalResponse {}
// Interrupt requests an abort without stopping the session: it raises
// the session's interrupt level to the running turn's turn_no and hints the
// holder. Without a running turn it changes nothing.
message InterruptRequest {
  string session_id = 1;
}
message InterruptResponse {}
// StopSession is idempotent, prevents new turns and stops the session's jobs.
// The holder keeps its lease until it has flushed and released it.
message StopSessionRequest {
  string session_id = 1;
}
message StopSessionResponse {}
// DeleteSession deletes a session and everything recorded for it. It is
// refused with FAILED_PRECONDITION, deleting nothing, unless the session is
// stopped, holds no unexpired lease and has no non-terminal call. NOT_FOUND
// when absent, including after a delete that already succeeded; an
// interrupted delete is finished by calling it again.
message DeleteSessionRequest {
  string session_id = 1;
}
message DeleteSessionResponse {}
// RecoverSession accepts a gap in a broken session's transcript. Allowed only
// while the session is BROKEN (else FAILED_PRECONDITION); accept_transcript_gap
// must be true (else INVALID_ARGUMENT). It first revokes any held lease
// (LeaseRevoked; that epoch is fenced), then moves the session to IDLE, or
// QUEUED with pending work, sets the gap mark (Lease.transcript_gap_turn_no)
// to the turn that broke, and records a TRANSCRIPT_GAP_ACCEPTED event. The
// mark stays set until the model has been told. The
// next holder resumes from the transcript the control plane holds, which
// lacks at least the failed batches. In the measured cases (whole turns,
// single entries and the tail missing) the CLI resumes it without error or
// signal: a hole inside the parentUuid chain is bridged (the model sees every
// surviving entry in file order and misses only the lost ones; two user
// turns left adjacent merge into one message), and a hole at the tail leaves
// the last surviving conversation entry as the leaf. A hole that splits a
// tool_use from its tool_result, holes in subagent subpaths and holes across
// a compaction are not measured yet. The worker keeps every surviving entry,
// publishes a TRANSCRIPT_GAP_DETECTED event for a hole it finds while the
// mark is set, and tells the model once, in the next turn it starts with a
// pushed message, that part of the history is missing. Without it the session stays BROKEN.
message RecoverSessionRequest {
  string session_id = 1;
  bool accept_transcript_gap = 2;
}
message RecoverSessionResponse {}

// RetryWorkspace starts the session's workspace over after a failure:
// FAILED becomes PENDING. Any other state is returned unchanged
// (idempotent). FAILED_PRECONDITION for a session without a workspace.
// Allowed for stopped sessions too: the workspace belongs to the project.
message RetryWorkspaceRequest {
  string session_id = 1;
}
message RetryWorkspaceResponse {
  WorkspaceStatus workspace = 1;
}
