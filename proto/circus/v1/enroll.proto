syntax = "proto3";

package circus.v1;

option go_package = "github.com/EricWvi/circus/gen/go/circus/v1;circusv1";

// Role identifies an independently credentialed principal on a machine.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_DAEMON = 1;
  ROLE_WORKER = 2;
}

// EnrollService exchanges one-time tokens for machine-role credentials via
// unary Connect RPC. Authentication for links is on the HTTP upgrade request.
service EnrollService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// EnrollRequest exchanges one role-bound token for one machine-role identity.
// A join command may call Enroll for both roles to obtain two credentials.
// No cross-role atomicity is implied; each token is independently single-use.
message EnrollRequest {
  string one_time_token = 1;
  Role role = 2;
  // The identity name; empty for the first label of hostname, or, with a
  // token issued to replace an identity, for that identity's name. A token
  // that replaces an identity refuses any other name (INVALID_ARGUMENT).
  string name = 3;
  string hostname = 4;
  // Shared machine hash links identities; credentials and revocation stay separate.
  string machine_id = 5;
  string os = 6;
  string arch = 7;
  string client_version = 8;
}

// EnrollResponse returns the identity and credential for the requested role.
// Worker and daemon have different IDs/tokens even on the same machine; either
// role can be revoked independently. Treat long_term_token as secret.
message EnrollResponse {
  // Principal ID; also used for worker identities.
  string principal_id = 1;
  string long_term_token = 2;
  string control_plane_url = 3;
  // The identity this enrollment replaced: set when the one-time token was
  // issued to rejoin as an identity of the user (a "Rejoin" link, or
  // `circus server enroll-token create --replace`). That identity was
  // revoked, as deleting it would, in the transaction that created the new
  // one, which took its name. Unset for a plain enrollment.
  ReplacedIdentity replaced = 4;
  // The name the identity was enrolled under: the request's name, the
  // hostname's first label without one, or the replaced identity's name.
  string name = 5;

  // ReplacedIdentity is the revoked identity, as it was named.
  message ReplacedIdentity {
    string principal_id = 1;
    string name = 2;
  }
}
