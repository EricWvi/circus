// Version 1 of the circus device protocol. circus is pre-release and offers
// no backward-compatibility guarantee yet. WSS envelopes, handshake, versioning,
// heartbeat and fragmentation are defined in link.proto and the role link files.
syntax = "proto3";

package circus.v1;

option go_package = "github.com/EricWvi/circus/gen/go/circus/v1;circusv1";

// DeviceCall is one tool invocation from the worker to a device daemon.
message DeviceCall {
  // Globally unique ID used by the daemon to deduplicate calls (UUID/ULID recommended).
  // Required: 1-128 bytes, charset [A-Za-z0-9_-].
  string call_id = 1;
  // Owning circus session. The daemon attributes background jobs and their
  // output files to it. Required: 1-128 bytes, charset [A-Za-z0-9_-].
  string session_id = 2;
  // SDK subagent ID, or an empty string for the main thread. Relay metadata:
  // the daemon validates it but attributes jobs and output by session_id
  // only; the control plane stores it in the call's metadata. May be empty;
  // otherwise charset
  // [A-Za-z0-9_-], at most 128 bytes.
  string agent_id = 3;
  // Locally enforced timeout in milliseconds; zero uses the daemon default of
  // two minutes, and requests above the ten-minute maximum are clamped to it.
  // Explicit background Bash uses this as its lifetime (default 30 minutes,
  // maximum two hours). Foreground Bash can move to background at its deadline;
  // its remaining background lifetime then defaults to 30 minutes (max two hours).
  uint32 timeout_ms = 4;
  // Tool invocation to execute.
  oneof tool {
    // Shell command invocation.
    BashRequest bash = 10;
    // File read invocation.
    ReadRequest read = 11;
    // File write invocation.
    WriteRequest write = 12;
    // File edit invocation.
    EditRequest edit = 13;
    // Background job stop invocation.
    TaskStopRequest task_stop = 14;
    // Project default directory preparation (control plane only).
    PrepareWorkspaceRequest prepare_workspace = 15;
    // Project default directory removal (control plane only).
    RemoveWorkspaceRequest remove_workspace = 16;
  }
}

// DeviceResult is the final result of a DeviceCall.
message DeviceResult {
  // ID of the completed call: 1-128 bytes, charset [A-Za-z0-9_-].
  string call_id = 1;
  // Exactly the tool output presented to the model.
  ToolOutput output = 2;
  // Present only for daemon failures; ordinary tool errors only set output.is_error.
  // Output still contains the model-visible Error text when a fault is present.
  DaemonFault fault = 3;
  // Structured metadata for the worker's session state.
  oneof detail {
    // Shell command metadata.
    BashResult bash = 10;
    // File read metadata.
    ReadResult read = 11;
    // File write metadata.
    WriteResult write = 12;
    // File edit metadata.
    EditResult edit = 13;
    // Background job stop metadata.
    TaskStopResult task_stop = 14;
    // Workspace preparation outcome.
    PrepareWorkspaceResult prepare_workspace = 15;
    // Workspace removal outcome.
    RemoveWorkspaceResult remove_workspace = 16;
  }
}

// DaemonFault distinguishes daemon failures from ordinary tool errors.
message DaemonFault {
  // Code identifies the daemon failure.
  enum Code {
    // No failure code supplied.
    CODE_UNSPECIFIED = 0;
    // Tool.Run returned a Go error.
    CODE_INTERNAL = 1;
    // Tool execution panicked.
    CODE_PANIC = 2;
    // Tool did not return within the timeout abandonment grace.
    CODE_ABANDONED_AFTER_TIMEOUT = 3;
    // Tool did not return within the cancellation abandonment grace.
    CODE_ABANDONED_AFTER_CANCEL = 4;
    // Preparation exhausted its deadline or abandonment grace.
    CODE_PREPARATION_EXHAUSTED = 5;
    // This daemon version does not provide the requested tool.
    CODE_TOOL_UNAVAILABLE = 6;
  }
  // Machine-readable failure category; never CODE_UNSPECIFIED when present.
  Code code = 1;
  // Diagnostic text; the model-visible output remains in DeviceResult.output.
  string message = 2;
}

// ToolOutput contains model-visible output and the tool failure indicator.
message ToolOutput {
  // Ordered blocks presented to the model.
  repeated ContentBlock content = 1;
  // Whether the tool reported a failure.
  bool is_error = 2;
}

// ContentBlock is one model-visible text or image block.
message ContentBlock {
  // Content represented by this block.
  oneof block {
    // Text content presented to the model.
    string text = 1;
    // Reserved for image reads; not produced yet.
    ImageBlock image = 2;
  }
}

// ImageBlock holds encoded image content.
message ImageBlock {
  // MIME media type of the encoded image.
  string media_type = 1;
  // Encoded image bytes.
  bytes data = 2;
}

// BashRequest asks the daemon to execute a shell command.
message BashRequest {
  // Shell command to execute.
  string command = 1;
  // Absolute working directory tracked by the worker per session, agent, and
  // device. Required and absolute. A deleted directory falls back to working_dirs[0];
  // a missing start folder is an error.
  string cwd = 2;
  // Whether to run the command as a background job; its lifetime then uses
  // timeout_ms, defaulting to 30 minutes and capped at two hours.
  bool run_in_background = 3;
  // Informational description with no execution semantics.
  string description = 4;
  // Directories inside which a cd persists; the first is the start folder the shell
  // returns to otherwise. Empty means cwd itself is the only working directory.
  repeated string working_dirs = 5;
}

// BashResult records the shell command outcome and output location.
message BashResult {
  // Process exit code.
  int32 exit_code = 1;
  // Working directory after the command finished.
  string cwd = 2;
  // Whether the command exceeded its timeout.
  bool timed_out = 3;
  // Whether the command was cancelled.
  bool interrupted = 4;
  // Whether model-visible output was truncated.
  bool output_truncated = 5;
  // Full output file on the device when truncated or backgrounded.
  string output_path = 6;
  // Background job ID, set for explicit background runs and timeout promotion.
  string job_id = 7;
}

// ReadRequest asks the daemon to read a file.
message ReadRequest {
  // Path of the file to read.
  string path = 1;
  // Starting line; absent starts at 1, while explicit zero starts at the first line numbered 0.
  optional uint32 offset = 2;
  // Maximum lines to return; zero means no line-count limit. A read with offset
  // unset and limit zero of a file larger than 256 KiB fails; set offset or a
  // positive limit to read portions of it.
  uint32 limit = 3;
  // Session working directory on the device; relative paths resolve against it
  // and it appears in some native error texts. Empty falls back to the daemon
  // process's working directory.
  string cwd = 4;
}

// ReadResult records metadata for the whole file that was read.
message ReadResult {
  // Hexadecimal SHA-256 of the whole file content.
  string sha256 = 1;
  // File modification time in milliseconds since the Unix epoch.
  int64 mtime_unix_ms = 2;
  // Total number of lines in the file.
  uint32 total_lines = 3;
}

// WriteRequest asks the daemon to create or overwrite a file.
message WriteRequest {
  // Path of the file to write.
  string path = 1;
  // Complete replacement file content.
  string content = 2;
  // Hash observed at the last read; absent means never read in this session.
  optional string expected_sha256 = 3;
  // Session working directory on the device; relative paths resolve against it
  // and it appears in some native error texts. Empty falls back to the daemon
  // process's working directory.
  string cwd = 4;
}

// WriteResult records the written file's hash and creation status.
message WriteResult {
  // Hexadecimal SHA-256 of the resulting whole file content.
  string sha256 = 1;
  // Whether the write created a new file.
  bool created = 2;
}

// EditRequest asks the daemon to replace matching text in a file.
message EditRequest {
  // Path of the file to edit.
  string path = 1;
  // Existing text to match. Empty writes new_string as the whole content of a
  // missing or empty file; a non-empty file is an error.
  string old_string = 2;
  // Replacement text for the match.
  string new_string = 3;
  // Whether to replace all occurrences of the matched text.
  bool replace_all = 4;
  // Hash observed at the last read; absent means never read in this session.
  optional string expected_sha256 = 5;
  // Session working directory on the device; relative paths resolve against it
  // and it appears in some native error texts. Empty falls back to the daemon
  // process's working directory.
  string cwd = 6;
}

// EditResult records the edited file's hash and intervening modification status.
message EditResult {
  // Hexadecimal SHA-256 of the resulting whole file content.
  string sha256 = 1;
  // Whether the file had changed since the session last read it.
  bool modified_since_read = 2;
  // Edit created a new file from an empty old_string.
  bool created = 3;
}

// TaskStopRequest asks the daemon to stop a background job.
message TaskStopRequest {
  // ID of the background job to stop.
  string job_id = 1;
}

// TaskStopResult acknowledges completion of a background job stop request.
message TaskStopResult {}

// CallQuery retrieves lifecycle state; completed results are kept by call_id for a TTL.
message CallQuery {
  // ID of the call whose state is requested: 1-128 bytes, charset [A-Za-z0-9_-].
  string call_id = 1;
}

// CallStatus describes the current lifecycle state of a device call.
message CallStatus {
  // State identifies the call's lifecycle stage.
  enum State {
    // No lifecycle state was specified.
    STATE_UNSPECIFIED = 0;
    // The call is executing.
    STATE_RUNNING = 1;
    // The call completed and has a retained result.
    STATE_COMPLETED = 2;
    // The call or its retained result is no longer available.
    STATE_LOST = 3;
  }
  // ID of the queried call: 1-128 bytes, charset [A-Za-z0-9_-].
  string call_id = 1;
  // Current lifecycle state.
  State state = 2;
  // Retained final result, set when state is STATE_COMPLETED.
  DeviceResult result = 3;
}

// CancelCall is idempotent: unknown or completed calls are a no-op.
// DispatchCall must precede CancelCall for the same call, including on resend.
message CancelCall {
  // ID of the call to cancel: 1-128 bytes, charset [A-Za-z0-9_-].
  string call_id = 1;
}

// JobEvent is a background job state change pushed by the daemon.
// Within a boot, events across all jobs have strictly increasing seq, allocated
// under the manager lock in enqueue order, starting at 1. RUNNING transitions to
// EXITED or KILLED. The daemon never emits LOST: only the control plane marks jobs
// from an old boot LOST when boot_id changes. Job IDs are daemon-generated
// 12-character hex strings; their global key is (device_id, boot_id, job_id).
// There is no event replay. Reconnect always requests ListJobs; discard events
// at or below the snapshot high-water mark. A live sequence gap is an assertion
// failure requiring a fresh snapshot (queue overflow closes the connection).
// No ordering is guaranteed relative to ack or result. An event may arrive
// before its creating call's result; associate it using call_id.
message JobEvent {
  // State identifies the background job's lifecycle stage.
  enum State {
    // No lifecycle state was specified.
    STATE_UNSPECIFIED = 0;
    // The job is executing.
    STATE_RUNNING = 1;
    // The job exited.
    STATE_EXITED = 2;
    // The job was killed.
    STATE_KILLED = 3;
    // The old boot is lost; produced only by the control plane, never the daemon.
    STATE_LOST = 4;
  }
  // ID of the background job that changed state.
  string job_id = 1;
  // Owning session: 1-128 bytes, charset [A-Za-z0-9_-].
  string session_id = 2;
  // Current background job lifecycle state.
  State state = 3;
  // Process exit code when the job has terminated.
  int32 exit_code = 4;
  // Path to the job's full output file on the device.
  string output_path = 5;
  // Boot-wide global event sequence; starts at 1, strictly increasing.
  uint64 seq = 6;
  // Creating call (explicit background or timeout promotion): 1-128 bytes,
  // charset [A-Za-z0-9_-].
  string call_id = 7;
}

// PrepareWorkspaceRequest makes sure a project's default directory exists on
// the device: it creates an empty directory, clones repo_url into it, or
// accepts what is there (docs/wire.md "Workspace preparation"). The control
// plane sends it, never a worker, with a session_id of the form
// "workspace-<workspace_id>" that no session has. Idempotent: repeating it
// after success reports READY without changing anything. Daemons declare
// the Hello feature "device_call.prepare_workspace"; the control plane only
// sends it to connections that did.
//
// The daemon resolves the path, creates its parent, takes a lock beside the
// target, and then acts on what the target is:
//   - absent: creates it (repo_url empty) or clones into a hidden sibling
//     and renames that onto the target once the clone is complete;
//   - an empty directory: uses it (repo_url empty) or clones as above,
//     replacing the empty directory;
//   - a repository whose own top level is the target and whose origin is
//     the same remote as repo_url: uses it;
//   - anything else non-empty: NOT_EMPTY, or REMOTE_MISMATCH for a
//     repository root with a different (or no) origin; a non-directory in
//     the way is PATH_CONFLICT. The daemon never modifies the target's
//     existing contents.
// git runs without a shell, with the environment the Bash tool builds from
// the login shell (so the user's credential helpers and ssh-agent apply),
// GIT_TERMINAL_PROMPT=0 and no repository-locating variables. Clones are
// full clones.
message PrepareWorkspaceRequest {
  // "~/" followed by a relative path, or an absolute path, resolved like
  // ListDirectoryQuery.path; "" and "~" alone are INVALID_REQUEST. The
  // control plane sends "~/circus/projects/<project_id>". Valid UTF-8, at
  // most 4096 bytes, no NUL.
  string path = 1;
  // Empty: an empty directory is the workspace. Otherwise the repository
  // to clone, passed to git as given (it may carry credentials, which the
  // daemon never echoes); at most 2048 bytes.
  string repo_url = 2;
  // A background job of an earlier attempt of this preparation (same
  // session_id). If the daemon still knows it, it waits for it until this
  // call's deadline, or returns its retained outcome, instead of starting
  // anything; otherwise it prepares as if this were empty.
  string resume_job_id = 3;
}

// PrepareWorkspaceResult is the structured outcome of PrepareWorkspaceRequest.
// DeviceResult.output carries one human-readable line; is_error matches
// OUTCOME_FAILED.
message PrepareWorkspaceResult {
  // Outcome of the call.
  enum Outcome {
    // Not set.
    OUTCOME_UNSPECIFIED = 0;
    // The workspace exists at path.
    OUTCOME_READY = 1;
    // The clone outlived the call's deadline and continues as background
    // job job_id of the call's session; ask again with resume_job_id once
    // the job has ended.
    OUTCOME_IN_BACKGROUND = 2;
    // Preparation failed; see error.
    OUTCOME_FAILED = 3;
  }
  // What a READY preparation did.
  enum Action {
    // Not set.
    ACTION_UNSPECIFIED = 0;
    // Created an empty directory.
    ACTION_CREATED = 1;
    // The directory existed and was empty.
    ACTION_USED_EMPTY = 2;
    // Cloned repo_url.
    ACTION_CLONED = 3;
    // The directory was already a repository of the same remote.
    ACTION_USED_REPOSITORY = 4;
  }
  // Outcome of the call.
  Outcome outcome = 1;
  // Absolute, lexically clean, valid UTF-8 path (symlinks not resolved).
  // Set for READY, and for FAILED once the path could be resolved.
  string path = 2;
  // READY only.
  Action action = 3;
  // IN_BACKGROUND only.
  string job_id = 4;
  // FAILED only.
  WorkspaceError error = 5;
  // FAILED only: at most 1024 bytes of valid UTF-8 with credentials
  // removed: the tail of git's stderr for CLONE_FAILED and NO_SPACE, the
  // existing origin for REMOTE_MISMATCH, empty otherwise.
  string error_detail = 6;
}

// RemoveWorkspaceRequest deletes a project's default directory when the
// user deletes the project and asks for it. The control plane sends it,
// never a worker, once, with a session_id "workspace-<workspace_id>".
// Daemons declare the Hello feature "device_call.remove_workspace".
//
// The daemon resolves the path and refuses (REFUSED) anything but a real
// directory (not a symlink) whose resolved path is exactly
// "<home>/circus/projects/<name>" for a single path element <name>. It
// removes the directory recursively without following symlinks inside it.
message RemoveWorkspaceRequest {
  // "~/circus/projects/<project_id>"; same rules as
  // PrepareWorkspaceRequest.path.
  string path = 1;
}

// RemoveWorkspaceResult is the structured outcome of RemoveWorkspaceRequest.
message RemoveWorkspaceResult {
  // Outcome of the call.
  enum Outcome {
    // Not set.
    OUTCOME_UNSPECIFIED = 0;
    // The directory was removed.
    OUTCOME_REMOVED = 1;
    // There was nothing at path.
    OUTCOME_ABSENT = 2;
    // Nothing or only part was removed; see error.
    OUTCOME_FAILED = 3;
  }
  // Outcome of the call.
  Outcome outcome = 1;
  // Absolute path, as in PrepareWorkspaceResult.path.
  string path = 2;
  // FAILED only: REFUSED, PERMISSION_DENIED, HOME_UNKNOWN, INVALID_REQUEST,
  // UNSUPPORTED_OS, BUSY (a preparation holds the lock) or IO.
  WorkspaceError error = 3;
  // FAILED only: at most 1024 bytes of valid UTF-8 explaining the failure.
  string error_detail = 4;
}

// WorkspaceError classifies workspace failures. Daemons send values up to
// 99; the control plane also sets one of them when it reaches the same
// conclusion itself (e.g. TIMEOUT when a background clone outlived its
// lifetime without the daemon reporting). Values from 100 are set by the
// control plane only.
enum WorkspaceError {
  // Not set.
  WORKSPACE_ERROR_UNSPECIFIED = 0;
  // Bad path or URL.
  WORKSPACE_ERROR_INVALID_REQUEST = 1;
  // The daemon user's home is unset, relative or not valid UTF-8.
  WORKSPACE_ERROR_HOME_UNKNOWN = 2;
  // The device's OS is not supported (Windows).
  WORKSPACE_ERROR_UNSUPPORTED_OS = 3;
  // The path or one of its ancestors is not a directory.
  WORKSPACE_ERROR_PATH_CONFLICT = 4;
  // The directory is not empty and is not a usable repository.
  WORKSPACE_ERROR_NOT_EMPTY = 5;
  // The directory is a repository root whose origin is another remote.
  WORKSPACE_ERROR_REMOTE_MISMATCH = 6;
  // git is not installed or not on PATH.
  WORKSPACE_ERROR_GIT_UNAVAILABLE = 7;
  // git clone failed.
  WORKSPACE_ERROR_CLONE_FAILED = 8;
  // The device ran out of disk space or quota.
  WORKSPACE_ERROR_NO_SPACE = 9;
  // Permission denied.
  WORKSPACE_ERROR_PERMISSION_DENIED = 10;
  // The clone exceeded its two-hour background lifetime.
  WORKSPACE_ERROR_TIMEOUT = 11;
  // Retryable: another preparation holds the lock, or the daemon's
  // workspace slots are full.
  WORKSPACE_ERROR_BUSY = 12;
  // Cancelled by CancelCall or by stopping the background job.
  WORKSPACE_ERROR_CANCELLED = 13;
  // Any other failure; details are in the daemon log.
  WORKSPACE_ERROR_IO = 14;
  // RemoveWorkspaceRequest only: the path is not a removable workspace.
  WORKSPACE_ERROR_REFUSED = 15;
  // Control plane only: the device was revoked.
  WORKSPACE_ERROR_DEVICE_REVOKED = 100;
  // Control plane only: attempts were lost three times in a row (daemon
  // restarts).
  WORKSPACE_ERROR_INTERRUPTED = 101;
  // Control plane only: a daemon fault other than TOOL_UNAVAILABLE.
  WORKSPACE_ERROR_DAEMON_FAULT = 102;
}
