// First version of the circus device protocol. circus is pre-release and offers
// no backward-compatibility guarantee yet. The transport envelope (WSS framing,
// handshake, and version) comes later.
syntax = "proto3";

package circus.v1;

option go_package = "github.com/EricWvi/circus/gen/go/circus/v1;circusv1";

// DeviceCall is one tool invocation from the worker to a device daemon.
message DeviceCall {
  // Globally unique UUID or ULID used by the daemon to deduplicate calls.
  string call_id = 1;
  // Owning circus session, including attribution for background jobs.
  string session_id = 2;
  // SDK subagent ID, or an empty string for the main thread.
  string agent_id = 3;
  // Locally enforced timeout in milliseconds; zero uses the tool default.
  uint32 timeout_ms = 4;
  // Tool invocation to execute.
  oneof tool {
    // Shell command invocation.
    BashRequest bash = 10;
    // File read invocation.
    ReadRequest read = 11;
    // File write invocation.
    WriteRequest write = 12;
    // File edit invocation.
    EditRequest edit = 13;
    // Background job stop invocation.
    TaskStopRequest task_stop = 14;
  }
}

// DeviceResult is the final result of a DeviceCall.
message DeviceResult {
  // ID of the completed call.
  string call_id = 1;
  // Exactly the tool output presented to the model.
  ToolOutput output = 2;
  // Structured metadata for the worker's session state.
  oneof detail {
    // Shell command metadata.
    BashResult bash = 10;
    // File read metadata.
    ReadResult read = 11;
    // File write metadata.
    WriteResult write = 12;
    // File edit metadata.
    EditResult edit = 13;
    // Background job stop metadata.
    TaskStopResult task_stop = 14;
  }
}

// ToolOutput contains model-visible output and the tool failure indicator.
message ToolOutput {
  // Ordered blocks presented to the model.
  repeated ContentBlock content = 1;
  // Whether the tool reported a failure.
  bool is_error = 2;
}

// ContentBlock is one model-visible text or image block.
message ContentBlock {
  // Content represented by this block.
  oneof block {
    // Text content presented to the model.
    string text = 1;
    // Reserved for image reads; not produced in M1.
    ImageBlock image = 2;
  }
}

// ImageBlock holds encoded image content.
message ImageBlock {
  // MIME media type of the encoded image.
  string media_type = 1;
  // Encoded image bytes.
  bytes data = 2;
}

// BashRequest asks the daemon to execute a shell command.
message BashRequest {
  // Shell command to execute.
  string command = 1;
  // Absolute working directory tracked by the worker per session, agent, and device.
  string cwd = 2;
  // Whether to run the command as a background job.
  bool run_in_background = 3;
  // Informational description with no execution semantics.
  string description = 4;
}

// BashResult records the shell command outcome and output location.
message BashResult {
  // Process exit code.
  int32 exit_code = 1;
  // Working directory after the command finished.
  string cwd = 2;
  // Whether the command exceeded its timeout.
  bool timed_out = 3;
  // Whether the command was cancelled.
  bool interrupted = 4;
  // Whether model-visible output was truncated.
  bool output_truncated = 5;
  // Full output file on the device when truncated or backgrounded.
  string output_path = 6;
  // Background job ID, set when run_in_background is true.
  string job_id = 7;
}

// ReadRequest asks the daemon to read a file.
message ReadRequest {
  // Path of the file to read.
  string path = 1;
  // Starting line: zero means the start; otherwise uses native tool 1-based lines.
  uint32 offset = 2;
  // Maximum lines to return; zero uses the default cap.
  uint32 limit = 3;
}

// ReadResult records metadata for the whole file that was read.
message ReadResult {
  // Hexadecimal SHA-256 of the whole file content.
  string sha256 = 1;
  // File modification time in milliseconds since the Unix epoch.
  int64 mtime_unix_ms = 2;
  // Total number of lines in the file.
  uint32 total_lines = 3;
}

// WriteRequest asks the daemon to create or overwrite a file.
message WriteRequest {
  // Path of the file to write.
  string path = 1;
  // Complete replacement file content.
  string content = 2;
  // Hash observed at the last read; absent means never read in this session.
  optional string expected_sha256 = 3;
}

// WriteResult records the written file's hash and creation status.
message WriteResult {
  // Hexadecimal SHA-256 of the resulting whole file content.
  string sha256 = 1;
  // Whether the write created a new file.
  bool created = 2;
}

// EditRequest asks the daemon to replace matching text in a file.
message EditRequest {
  // Path of the file to edit.
  string path = 1;
  // Existing text to match.
  string old_string = 2;
  // Replacement text for the match.
  string new_string = 3;
  // Whether to replace all occurrences of the matched text.
  bool replace_all = 4;
  // Hash observed at the last read; absent means never read in this session.
  optional string expected_sha256 = 5;
}

// EditResult records the edited file's hash and intervening modification status.
message EditResult {
  // Hexadecimal SHA-256 of the resulting whole file content.
  string sha256 = 1;
  // Whether the file had changed since the session last read it.
  bool modified_since_read = 2;
}

// TaskStopRequest asks the daemon to stop a background job.
message TaskStopRequest {
  // ID of the background job to stop.
  string job_id = 1;
}

// TaskStopResult acknowledges completion of a background job stop request.
message TaskStopResult {}

// CallQuery retrieves lifecycle state (D41); completed results are kept by call_id for a TTL.
message CallQuery {
  // ID of the call whose state is requested.
  string call_id = 1;
}

// CallStatus describes the current lifecycle state of a device call.
message CallStatus {
  // State identifies the call's lifecycle stage.
  enum State {
    // No lifecycle state was specified.
    STATE_UNSPECIFIED = 0;
    // The call is executing.
    STATE_RUNNING = 1;
    // The call completed and has a retained result.
    STATE_COMPLETED = 2;
    // The call or its retained result is no longer available.
    STATE_LOST = 3;
  }
  // ID of the queried call.
  string call_id = 1;
  // Current lifecycle state.
  State state = 2;
  // Retained final result, set when state is STATE_COMPLETED.
  DeviceResult result = 3;
}

// CancelCall asks the daemon to cancel an in-flight call.
message CancelCall {
  // ID of the call to cancel.
  string call_id = 1;
}

// JobEvent is a background job state change pushed by the daemon.
message JobEvent {
  // State identifies the background job's lifecycle stage.
  enum State {
    // No lifecycle state was specified.
    STATE_UNSPECIFIED = 0;
    // The job is executing.
    STATE_RUNNING = 1;
    // The job exited.
    STATE_EXITED = 2;
    // The job was killed.
    STATE_KILLED = 3;
    // The job's state is no longer available.
    STATE_LOST = 4;
  }
  // ID of the background job that changed state.
  string job_id = 1;
  // Session that owns the background job.
  string session_id = 2;
  // Current background job lifecycle state.
  State state = 3;
  // Process exit code when the job has terminated.
  int32 exit_code = 4;
  // Path to the job's full output file on the device.
  string output_path = 5;
}
