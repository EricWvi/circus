version: "3"

# Defaults for the task knobs below; override any of them on the command
# line, e.g. `task fuzz FUZZTIME=10s` or `task seeds CIRCUS_ROUTER_SEEDS=50`.
vars:
  FUZZTIME: "30s"
  CIRCUS_ROUTER_SEEDS: "500"
  CIRCUS_ROUTER_FIRST_SEED: "1"
  MUTATE_TIMEOUT: "30s"
  MUTATE_OUT: ".tmp/mutation/report.json"

tasks:
  gen:
    desc: Generate Go and TypeScript code from the protocol
    cmds:
      - buf generate

  lint:
    desc: Lint the protocol, vet and format-check Go code, and typecheck the worker
    cmds:
      - buf lint
      - go vet ./...
      - go vet -tags dev ./cmd/circus-fakeworker
      - |
        files="$(gofmt -l $(go list -f '{{"{{.Dir}}"}}' ./...))"
        if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - npm -w @circus/worker run typecheck

  test:
    desc: Run Go and worker tests
    cmds:
      - go test ./...
      - task: worker:test

  worker:build:
    desc: Build the TypeScript worker into worker/dist
    cmds:
      - npm -w @circus/worker run build

  worker:test:
    desc: Run the TypeScript worker tests
    cmds:
      - npm -w @circus/worker run test

  worker:package:
    desc: Build the linux-amd64 worker release package into .tmp/worker-package (TAG, default v0.0.0-dev)
    vars:
      TAG: '{{.TAG | default "v0.0.0-dev"}}'
    cmds:
      - node worker/scripts/package.mjs '{{.TAG}}' .tmp/worker-package linux-amd64

  mutate:
    desc: Run sandboxed syntax mutations against one Go package
    cmds:
      - go run ./tools/mutate -timeout '{{.MUTATE_TIMEOUT}}' -out '{{.MUTATE_OUT}}'{{if .MUTATE_WORKERS}} -workers '{{.MUTATE_WORKERS}}'{{end}} '{{.PKG}}'

  race:
    desc: Run Go tests with the race detector
    cmds:
      - go test -race ./...

  e2e:
    desc: Run the process end-to-end tests once
    cmds:
      - go test -tags e2e ./tests/e2e/ -count=1

  e2e-race:
    desc: Run the process end-to-end tests with the race detector, E2E_COUNT times (default 3)
    vars:
      E2E_COUNT: '{{.E2E_COUNT | default "3"}}'
    cmds:
      - go test -race -tags e2e ./tests/e2e/ -count={{.E2E_COUNT}}

  check-gen:
    desc: Fail if generation changed tracked files or produced untracked ones
    cmds:
      - task: gen
      - git diff --exit-code --stat -- gen/
      - |
        untracked="$(git ls-files --others --exclude-standard -- gen/)"
        if [ -n "$untracked" ]; then printf '%s\n' "$untracked"; exit 1; fi

  build:
    desc: Build bin/circus
    cmds:
      - go build -o bin/circus ./cmd/circus

  build:webui:
    desc: Build bin/circus with the embedded Web UI
    cmds:
      - VITE_CIRCUS_BACKEND=server task web:build
      - go build -tags webui -o bin/circus ./cmd/circus

  fuzz:
    desc: Run every fuzz target for FUZZTIME (default 30s)
    cmds:
      - for:
          var: FUZZ_TARGETS
        cmd: go test -run '^$' -fuzz '^{{.ITEM}}$' -fuzztime {{.FUZZTIME}} ./internal/wire/
    vars:
      # One line per target; `go test -fuzz` accepts a single target.
      FUZZ_TARGETS:
        - FuzzDecode
        - FuzzReassembly

  seeds:
    desc: Router random-sequence sweep of TestRandomSequences (CIRCUS_ROUTER_SEEDS seeds from CIRCUS_ROUTER_FIRST_SEED)
    cmds:
      - |
        seeds="{{.CIRCUS_ROUTER_SEEDS}}"
        case "$seeds" in ''|*[!0-9]*) echo "CIRCUS_ROUTER_SEEDS must be a positive integer, got '$seeds'" >&2; exit 1;; esac
        # A seed takes about 1s locally (non-race); 10s per seed
        # gives a slow-CI safety factor while bounding a hang.
        CIRCUS_ROUTER_SEEDS="$seeds" CIRCUS_ROUTER_FIRST_SEED="{{.CIRCUS_ROUTER_FIRST_SEED}}" \
          go test -run '^TestRandomSequences$' -count=1 -timeout "$((seeds * 10))s" ./internal/controlplane/calls/

  parity-diff:
    desc: Compare generated native and daemon tool scenarios inside bubblewrap
    cmds:
      - node tests/parity/diff/run.mjs --generated --mode combo --seed {{.SEED}} --count {{.COUNT}}
      - node tests/parity/diff/run.mjs --generated --mode deck --seed {{.SEED}} --count {{.DECK_COUNT}}
    vars:
      SEED: '{{default "1" .SEED}}'
      COUNT: '{{default "200" .COUNT}}'
      DECK_COUNT: '{{default "70" .DECK_COUNT}}'

  parity-diff-sessions:
    desc: Extract local tool inputs and compare them inside bubblewrap
    cmds:
      - node tests/parity/diff/extract-sessions.mjs
      - node tests/parity/diff/run.mjs --sessions .tmp/diff-corpus/sessions.jsonl --limit {{.LIMIT}}
    vars:
      LIMIT: '{{default "60" .LIMIT}}'

  web:dev:
    desc: Start the Web UI dev server (BACKEND=server sends auth to `task web:dev:server`)
    cmds:
      - '{{if .BACKEND}}VITE_CIRCUS_BACKEND={{.BACKEND}} {{end}}npm -w @circus/web run dev'

  web:dev:server:
    desc: Run the control plane for Web UI development (config web/dev.server.yaml)
    cmds:
      - go run ./cmd/circus server --config web/dev.server.yaml

  web:dev:worker:
    desc: Enroll and run the scripted worker for a Web UI account (USER_EMAIL=<email>)
    requires:
      vars: [USER_EMAIL]
    env:
      CIRCUS_DEV_USER_EMAIL: "{{.USER_EMAIL}}"
    cmds:
      - |
        export CIRCUS_HOME="$PWD/.tmp/dev"
        if [ ! -f "$CIRCUS_HOME/config/worker.json" ]; then
          worker_join_link="$(go run ./cmd/circus server enroll-token create --config web/dev.server.yaml --user "$CIRCUS_DEV_USER_EMAIL" --role worker --url http://127.0.0.1:8443)"
          printf '%s\n' "$worker_join_link" | go run ./cmd/circus join --role worker --name web-dev-worker
        fi
        go run -tags dev ./cmd/circus-fakeworker --name web-dev-worker

  cli:
    desc: Run the circus CLI from source with its files under .tmp/dev (task cli -- <args>)
    env:
      CIRCUS_HOME: "{{.ROOT_DIR}}/.tmp/dev"
    cmds:
      - go run ./cmd/circus {{.CLI_ARGS}}

  web:build:
    desc: Build the Web UI into web/dist
    cmds:
      - npm -w @circus/web run build

  web:check:
    desc: Typecheck, lint and test the Web UI
    cmds:
      - npm -w @circus/web run typecheck
      - npm -w @circus/web run lint
      - npm -w @circus/web run test
